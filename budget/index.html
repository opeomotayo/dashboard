<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Budget Console — a household month in one page: budget against actual by category, who spent what, and savings pots filling up. Local-first, with optional Google Drive sync.">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  body{font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fafaf9}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Budget Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ── Budget Console ────────────────────────────────────────────────────
   Planned against actual, line by line, split into what you cannot cut
   and what you can. Same type and tokens as the Goal and Property
   consoles.
   Colour is deliberately thin: one hue. Essential spending is the accent
   indigo, non-essential the de-emphasis grey, over-budget the reserved
   red. That is the emphasis pattern rather than a categorical palette —
   a second hue for "non-essential" collided with the over-budget red in
   dark mode (dE 7.0, floor 15), and a teal collided with the indigo
   (dE 14.0). One hue, one neutral and one status colour always separate.
   ──────────────────────────────────────────────────────────────────── */
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --sunken:#F4F6FA; --raised:#FFFFFF;
  --ink:#0B1020; --ink-2:#2D3650; --muted:#5C6880; --faint:#8E99AE;
  --line:#DFE4EE; --line-2:#C7D0E0;

  --accent:#3A4FC4; --accent-ink:#3A4FC4; --accent-soft:#E7EAFB; --on-accent:#FFFFFF;

  --hold:#0F7A55;  --hold-ink:#0F7A55;  --hold-soft:#E2F2EC;
  --slip:#B07D00;  --slip-ink:#8A6300;  --slip-soft:#F8EFD9;
  --stall:#C0203F; --stall-ink:#C0203F; --stall-soft:#FBE6EA;
  --off:#7A869E;   --off-ink:#5C6880;   --off-soft:#EDF0F5;

  --ess:#3A4FC4;  --ess-soft:#E7EAFB;      /* what you cannot cut */
  --non:#7A869E;  --non-soft:#EDF0F5;      /* what you can */
  --over:#C0203F; --over-soft:#FBE6EA;

  --shadow-1:0 1px 1px rgba(11,16,32,.04), 0 2px 6px -2px rgba(11,16,32,.08);
  --shadow-2:0 2px 4px rgba(11,16,32,.05), 0 14px 28px -16px rgba(11,16,32,.22);
  --r-lg:16px; --r-md:11px; --r-sm:7px;

  --display:"Bricolage Grotesque","Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#080B14; --surface:#121826; --sunken:#0D1220; --raised:#192030;
    --ink:#E9EDF7; --ink-2:#C3CBDD; --muted:#8E99B2; --faint:#68738C;
    --line:#212A3D; --line-2:#2E3850;
    --accent:#6478DE; --accent-ink:#9AA8F6; --accent-soft:#1A2142; --on-accent:#070A14;
    --hold:#0FA37E;  --hold-ink:#45D3A8;  --hold-soft:#0E2A24;
    --slip:#BE7A1E;  --slip-ink:#E0A94B;  --slip-soft:#2B2113;
    --stall:#DC4A72; --stall-ink:#F2819C; --stall-soft:#2E1620;
    --off:#5C6882;   --off-ink:#8E99B2;   --off-soft:#171E2D;
    --ess:#6478DE;  --ess-soft:#1A2142;
    --non:#67738F;  --non-soft:#171E2D;
    --over:#DC4A72; --over-soft:#2E1620;
    --shadow-1:0 1px 1px rgba(0,0,0,.5), 0 2px 8px -2px rgba(0,0,0,.6);
    --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 18px 34px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#080B14; --surface:#121826; --sunken:#0D1220; --raised:#192030;
  --ink:#E9EDF7; --ink-2:#C3CBDD; --muted:#8E99B2; --faint:#68738C;
  --line:#212A3D; --line-2:#2E3850;
  --accent:#6478DE; --accent-ink:#9AA8F6; --accent-soft:#1A2142; --on-accent:#070A14;
  --hold:#0FA37E;  --hold-ink:#45D3A8;  --hold-soft:#0E2A24;
  --slip:#BE7A1E;  --slip-ink:#E0A94B;  --slip-soft:#2B2113;
  --stall:#DC4A72; --stall-ink:#F2819C; --stall-soft:#2E1620;
  --off:#5C6882;   --off-ink:#8E99B2;   --off-soft:#171E2D;
  --ess:#6478DE;  --ess-soft:#1A2142;
  --non:#67738F;  --non-soft:#171E2D;
  --over:#DC4A72; --over-soft:#2E1620;
  --shadow-1:0 1px 1px rgba(0,0,0,.5), 0 2px 8px -2px rgba(0,0,0,.6);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 18px 34px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;
  line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.lbl,.field label,.scell .k{font-family:var(--mono);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint)}

/* ── shell ─────────────────────────────────────────────────────────── */
.shell{max-width:1100px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 76px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:13px}
.brand{display:flex;align-items:baseline;gap:11px;margin-right:auto;min-width:0}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
.brand .tag{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}

.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;
  transition:background .14s,border-color .14s,color .14s,transform .08s}
.btn:hover{background:var(--sunken);color:var(--ink);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 9px}
.btn-ghost:hover{background:var(--sunken);color:var(--ink)}
.btn-sm{font-size:12.5px;padding:6px 11px}
.btn-wipe{color:var(--stall-ink);border-color:var(--stall)}
.btn-wipe:hover{background:var(--stall-soft)}

.savepill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);white-space:nowrap}
.savepill .sdot{width:6px;height:6px;border-radius:50%;background:var(--hold);flex:none}
.savepill[data-s="saving"]{color:var(--accent-ink);border-color:var(--accent)}
.savepill[data-s="saving"] .sdot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.savepill[data-s="error"]{color:var(--stall-ink);background:var(--stall-soft);border-color:var(--stall)}
.savepill[data-s="error"] .sdot{background:var(--stall)}
.savepill[data-s="local"]{color:var(--slip-ink);background:var(--slip-soft);border-color:var(--slip)}
.savepill[data-s="local"] .sdot{background:var(--slip)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.pagenav{display:flex;gap:3px;background:var(--sunken);border:1px solid var(--line);
  border-radius:10px;padding:3px}
.pagenav button{border:0;background:transparent;padding:7px 15px;border-radius:7px;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .14s}
.pagenav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-1);font-weight:600}

/* ── period controls ───────────────────────────────────────────────── */
.periodnav{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:22px}
.navsel{display:inline-flex;align-items:center;gap:7px}
.navsellab{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}
select,input[type=text],input[type=number]{width:100%;background:var(--surface);
  border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.monsel{width:auto;min-width:88px;font-family:var(--display);font-weight:600;font-size:14.5px;
  padding:7px 10px;letter-spacing:-.01em}
.scope{display:inline-flex;gap:3px;background:var(--sunken);border:1px solid var(--line);
  border-radius:9px;padding:3px}
.scope button{border:0;background:transparent;padding:6px 13px;border-radius:6px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.scope button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:var(--shadow-1)}
.navnote{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint)}

/* ── panels ────────────────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);padding:22px 24px;margin-top:20px;
  display:flex;flex-direction:column;gap:19px}
.kpis{display:flex;gap:30px;flex-wrap:wrap}
.kpi{min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .kv{font-family:var(--display);font-size:29px;font-weight:800;line-height:1;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:11.5px;color:var(--muted);line-height:1.35}
.kv[data-over="1"]{color:var(--over)}

.wholebar{display:flex;gap:2px;height:15px;border-radius:999px;overflow:hidden;background:var(--sunken)}
.wholebar i{display:block;height:100%}
.wholebar i:first-child{border-radius:999px 0 0 999px}
.wholebar i:last-child{border-radius:0 999px 999px 0}
.key{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.key i{width:9px;height:9px;border-radius:2px;flex:none}
.split{border-top:1px solid var(--line);padding-top:17px}

/* variance: over and under a budget, either side of zero */
.figure{margin-top:22px}
.figure .fhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.figure h3{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.figure .fnote{font-size:11.5px;color:var(--muted)}
.figure .grow{flex:1 1 10px}
.dbar{display:grid;grid-template-columns:minmax(96px,164px) 1fr minmax(84px,auto);
  align-items:center;gap:13px;padding:5px 0}
.dbar .dname{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtrack{position:relative;height:18px;background:var(--sunken);border-radius:5px}
.dtrack .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.dtrack i{position:absolute;top:3px;bottom:3px;border-radius:3px;display:block}
.dbar .dval{font-family:var(--mono);font-size:12.5px;text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.dbar .dval[data-over="1"]{color:var(--over)}

/* ── expense lines ─────────────────────────────────────────────────── */
.grouphead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 10px}
.grouphead h2{font-size:17px;font-weight:700}
.grouphead .gdot{width:10px;height:10px;border-radius:3px;flex:none}
.grouphead .gsum{font-family:var(--mono);font-size:12.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.grouphead .grow{flex:1 1 10px}

.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-1);padding:14px 16px;margin-bottom:9px}
.line[data-over="1"]{border-color:var(--over)}
.lrow{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.lname{font-family:var(--display);font-size:15.5px;font-weight:700;letter-spacing:-.02em;min-width:0}
.lcat{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);background:var(--sunken);border:1px solid var(--line);
  padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.lfig{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.lfig b{color:var(--ink);font-weight:600}
.meter{margin-top:10px;height:10px;border-radius:999px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--ess)}
.line[data-g="nonessential"] .meter i{background:var(--non)}
.line[data-over="1"] .meter i{background:var(--over)}
.lacts{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:11px}
.lacts .grow{flex:1 1 10px}
.lleft{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.lleft[data-over="1"]{color:var(--over)}
.amtbox{display:inline-flex;align-items:center;gap:7px}
.amtbox input{width:106px}
.lnote{font-size:12px;color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-md);
  padding:24px 20px;text-align:center;color:var(--muted);font-size:14px}
.banner{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:18px;
  background:var(--slip-soft);border:1px solid var(--slip);border-radius:var(--r-md);
  padding:13px 16px;font-size:13.5px;color:var(--slip-ink)}
.banner .grow{flex:1 1 10px}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;
  background:var(--ink);color:var(--paper);padding:11px 17px;border-radius:999px;font-size:13.5px;
  box-shadow:var(--shadow-2);max-width:min(560px,92vw)}

/* ── pots ──────────────────────────────────────────────────────────── */
.pot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-1);padding:16px 18px;margin-bottom:10px}
.pot .meter i{background:var(--accent)}
.pot[data-full="1"] .meter i{background:var(--hold)}
.ptarget{font-family:var(--mono);font-size:12px;color:var(--muted)}
.quick{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:11px;
  border-top:1px dashed var(--line);padding-top:11px}
.quick input[type=number]{width:104px}
.quick input[type=text]{flex:1 1 150px;min-width:0}
.entries{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.entry{display:flex;align-items:baseline;gap:10px;padding:5px 0;font-size:13.5px}
.entry .edate{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;min-width:52px}
.entry .enote{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .eamt{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rm{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;padding:2px 5px;flex:none}
.rm:hover{color:var(--stall-ink)}

/* ── storage ───────────────────────────────────────────────────────── */
.store{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);margin-top:30px;overflow:hidden}
.shead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.shead h2{font-size:15.5px;font-weight:700}
.engine{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
.sgrid{display:flex;gap:26px;flex-wrap:wrap;padding:15px 18px}
.scell .v{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.sactions{padding:15px 18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.snote{margin:0;padding:0 18px 16px;font-size:12.5px;color:var(--muted)}

/* ── modal ─────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(8,11,20,.55);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);width:min(560px,100%)}
.mhead{padding:18px 20px 0}
.mhead h2{font-size:18px;font-weight:700}
.mbody{padding:16px 20px;display:flex;flex-direction:column;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field .hint{font-size:12px;color:var(--muted)}
.row2{display:flex;gap:13px;flex-wrap:wrap}
.row2 .field{flex:1 1 150px;min-width:0}
.seg{display:flex;gap:3px;background:var(--sunken);border:1px solid var(--line);
  border-radius:9px;padding:3px}
.seg button{flex:1 1 0;border:0;background:transparent;padding:8px 10px;border-radius:6px;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:var(--shadow-1)}
.mfoot{display:flex;gap:9px;padding:15px 20px 18px;border-top:1px solid var(--line)}
.mfoot .btn-danger{color:var(--stall-ink);border-color:var(--stall)}
.mfoot .btn-danger:hover{background:var(--stall-soft)}

@media(max-width:620px){
  .kpis{gap:20px}
  .kpi .kv{font-size:25px}
  .dbar{grid-template-columns:1fr minmax(76px,auto);row-gap:4px}
  .dbar .dname{grid-column:1 / -1}
  .lfig{margin-left:0;flex-basis:100%}
}
/* ── main dashboard ────────────────────────────────────────────────────
   The household year at a glance: headline tiles, a month calendar of
   no-spend days, income / expenses / savings / loan by month, fixed
   against variable, savings goals, loans, top categories, the 50/30/20
   rule and what is left of each budget. Slicers for year, month and who
   paid sit in a rail on the right. Series hues are the validated
   categorical order, slots 1–4 for the four money flows. */
:root{
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}
.shell,.topbar-in{max-width:1440px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px;margin-top:22px;align-items:start}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
  padding:15px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.dcard h3{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--ink);
  display:flex;align-items:center;gap:8px}
.dcard h3 .ic{font-size:15px;line-height:1}
.dcard .dsub{font-size:11.5px;color:var(--muted);margin-top:-6px}
.dcard .dgo{margin-top:auto;font-size:12px;color:var(--accent-ink);background:none;border:0;padding:4px 0 0;cursor:pointer;
  text-align:left;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.span12{grid-column:span 12} .span9{grid-column:span 9} .span5{grid-column:span 5} .span4{grid-column:span 4}
.span3{grid-column:span 3} .span2{grid-column:span 2}
.dtiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.dtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
  padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;min-width:0}
.dtile .ti{grid-row:1/span 3;width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;font-size:19px}
.dtile .tk{font-size:12px;color:var(--muted);font-weight:500}
.dtile .tv{font-family:var(--display);font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.05;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtile .ts{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.dtile button.ts{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--accent-ink);text-transform:none;letter-spacing:0;font:500 11.5px var(--body);text-decoration:underline;text-underline-offset:3px}

/* calendar */
.dcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.dcal .dh{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.06em;padding-bottom:3px}
.dcal button{border:1px solid transparent;background:var(--sunken);border-radius:6px;padding:0;height:28px;font:500 12px var(--body);
  color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.dcal button:hover{border-color:var(--line-2)}
.dcal button.ns{background:var(--hold-soft);color:var(--hold-ink);font-weight:700;border-color:color-mix(in srgb,var(--hold) 40%,transparent)}
.dcal button.sp{background:var(--surface);border-color:var(--line)}
.dcal button.today{outline:2px solid var(--accent);outline-offset:-2px}
.dcal button:disabled{background:transparent;color:var(--faint);cursor:default;border-color:transparent}
.dcalstats{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;color:var(--ink-2)}
.dcalstats b{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.dcalstats b.ns{color:var(--hold-ink)}
.dhint{font-size:11px;color:var(--faint);line-height:1.4}

/* legend + charts */
.dleg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.dleg span{display:inline-flex;align-items:center;gap:6px}
.dleg i{width:12px;height:4px;border-radius:2px;display:inline-block}
.dleg i.dot{width:9px;height:9px;border-radius:50%}
.dchart{position:relative;width:100%}
.dchart svg{display:block;width:100%;height:auto;overflow:visible}
.dchart .ax{font:10px var(--mono);fill:var(--faint)}
.dchart .grid{stroke:var(--line);stroke-width:1}
.dtip{position:fixed;z-index:200;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow-2);padding:8px 10px;font-size:12px;color:var(--ink-2);min-width:140px}
.dtip b{display:block;font-family:var(--display);font-size:13px;color:var(--ink);margin-bottom:4px}
.dtip div{display:flex;align-items:center;gap:7px;justify-content:space-between}
.dtip div span{display:inline-flex;align-items:center;gap:6px}
.dtip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dtip em{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.dtable{width:100%;border-collapse:collapse;font-size:12px}
.dtable th,.dtable td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable th{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dtoggle{font-size:11.5px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0;align-self:flex-start;text-decoration:underline;text-underline-offset:3px}

/* donuts */
.ddon{display:flex;flex-direction:column;align-items:center;gap:8px}
.ddon svg{width:100%;max-width:170px;height:auto}
.ddon .dc1{font-family:var(--display);font-size:15px;font-weight:800;fill:var(--ink)}
.ddon .dc2{font:7.5px var(--mono);fill:var(--muted);letter-spacing:.04em}
.dsplit{display:flex;justify-content:space-between;width:100%;font-size:12px;color:var(--ink-2);gap:8px}
.dsplit b{display:block;font-family:var(--mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.dsplit span:last-child{text-align:right}
.dsplit i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}

/* rings legend */
.drings{display:grid;grid-template-columns:minmax(90px,120px) minmax(0,1fr);gap:12px;align-items:center}
.drings svg{width:100%;height:auto}
.dlist{display:grid;gap:6px;font-size:12.5px;color:var(--ink-2);min-width:0}
.dlist div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.dlist i{width:10px;height:10px;border-radius:50%}
.dlist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}

/* loans */
.dloan{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center}
.dfig{display:grid;gap:9px}
.dfig .k{font-size:11.5px;color:var(--muted)}
.dfig .v{font-family:var(--display);font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}

/* horizontal bars */
.dbars{display:grid;gap:7px}
.dbr{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr);gap:9px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.dbr .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbr .t{height:18px;background:var(--sunken);border-radius:4px;position:relative;overflow:hidden}
.dbr .t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.dbr .t em{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}

/* 50/30/20 */
.drule{display:grid;gap:11px}
.drow{display:grid;grid-template-columns:minmax(70px,96px) 44px minmax(0,1fr);gap:9px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.drow .n b{display:block;color:var(--ink);font-weight:600}
.drow .n small{color:var(--faint);font-size:11px}
.drow .tg{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.drow .t{height:20px;background:var(--sunken);border-radius:5px;position:relative;overflow:hidden}
.drow .t i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.drow .t i.warn{background:var(--slip)} .drow .t i.bad{background:var(--stall)} .drow .t i.ok{background:var(--hold)}
.drow .t u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);text-decoration:none}
.drow .t em{position:absolute;left:8px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);font-style:normal;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.drow .t em.out{color:var(--ink)}
.drule .st{font-size:11.5px;color:var(--muted);line-height:1.45}

/* available budget */
.davail{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 22px}
.dav{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2)}
.dav .h{display:flex;justify-content:space-between;gap:8px}
.dav .h b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.dav .h b.over{color:var(--over)}
.dav .t{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.dav .t i{display:block;height:100%;background:var(--ess);border-radius:4px}
.dav .t i.over{background:var(--over)}
.dav small{font-size:10.5px;color:var(--faint);font-family:var(--mono)}

/* slicer rail */
.drail{display:grid;gap:12px;position:sticky;top:76px}
.dslice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;box-shadow:var(--shadow-1)}
.dslice .sh{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.dslice .sh button{background:none;border:0;color:var(--accent-ink);cursor:pointer;font:500 11px var(--body);padding:0}
.dslice .sl{display:grid;gap:3px}
.dslice .sl button{border:1px solid var(--line);background:var(--sunken);border-radius:6px;padding:5px 8px;text-align:left;cursor:pointer;
  font:500 12.5px var(--body);color:var(--ink-2)}
.dslice .sl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.dempty{font-size:12.5px;color:var(--muted);line-height:1.5}
.dempty button{background:none;border:0;padding:0;color:var(--accent-ink);text-decoration:underline;cursor:pointer;font:inherit}

/* income + loan pages */
.icard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.icard:first-child{border-top:0}
.icard .nm{font-weight:600;color:var(--ink);font-size:14.5px}
.icard .mt{font-size:12px;color:var(--muted);margin-top:2px}
.icard .rt{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.icard input[type=number]{width:120px}
.pchip{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--sunken);color:var(--muted);border:1px solid var(--line);margin-left:6px;vertical-align:1px}
.lmeter{grid-column:1/-1;height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.lmeter i{display:block;height:100%;background:var(--s3);border-radius:4px}
.fmodal .field select,.fmodal .field input{width:100%}

@media (max-width:1180px){
  .dash{grid-template-columns:minmax(0,1fr)}
  .drail{position:static;grid-template-columns:repeat(3,minmax(0,1fr));order:-1}
  .dslice .sl{display:flex;flex-wrap:wrap;max-height:none}
}
@media (max-width:1000px){
  .dgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .span12,.span9{grid-column:span 6} .span5{grid-column:span 6} .span4,.span3{grid-column:span 3} .span2{grid-column:span 3}
  .dtiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:640px){
  .pagenav{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .dgrid>*{grid-column:1/-1!important}
  .dtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dtile .tv{font-size:20px}
  .dtile{grid-template-columns:minmax(0,1fr)} .dtile .ti{display:none}
  .drail{grid-template-columns:minmax(0,1fr)}
  .icard{grid-template-columns:minmax(0,1fr)} .icard .rt{justify-content:flex-start}
}
</style>


</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>Budget Console</h1>
      <span class="tag" id="todayTag"></span>
    </div>
    <div class="pagenav" id="pagenav"></div>
    <span class="savepill" id="savepill" data-s="saved">
      <span class="sdot"></span><span id="savetext">Saved</span>
    </span>
    <button class="btn btn-sm" id="exportBtn">Export</button>
    <button class="btn btn-primary" id="newBtn">New expense</button>
  </div>
</div>

<div class="shell">
  <div class="periodnav" id="periodnav"></div>
  <div id="pageBody"></div>

  <section class="store">
    <div class="shead">
      <h2>Local database</h2>
      <span class="engine" id="engineChip">connecting…</span>
    </div>
    <div class="sgrid" id="sgrid"></div>
    <div class="sactions">
      <label class="switch" for="syncToggle">
        <input type="checkbox" id="syncToggle">
        <span>Sync across my devices</span>
      </label>
      <button class="btn btn-sm" id="syncNowBtn">Sync now</button>
      <span style="flex:1 1 20px"></span>
      <button class="btn btn-sm" id="importBtn">Import</button>
      <button class="btn btn-sm" id="exportBtn2">Export</button>
      <button class="btn btn-sm btn-wipe" id="wipeBtn">Wipe database</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="snote" id="snote"></p>
  </section>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead"><h2 id="mTitle">New expense</h2></div>
    <div class="mbody">
      <div class="field">
        <label for="fName" id="fNameLab">Expense</label>
        <input type="text" id="fName" placeholder="Groceries">
      </div>
      <div class="row2" id="lineFields">
        <div class="field">
          <label for="fCat">Category</label>
          <select id="fCat"></select>
        </div>
        <div class="field">
          <label for="fBudget" id="fBudgetLab">Monthly budget</label>
          <input type="number" id="fBudget" min="0" step="any" placeholder="650">
        </div>
      </div>
      <div class="field" id="groupWrap">
        <label id="fGroupLab">Essential or not</label>
        <div class="seg" id="fGroup" role="group" aria-label="Essential or not"></div>
        <span class="hint" id="groupHint"></span>
      </div>
      <div class="row2" id="lineFields2">
        <div class="field">
          <label for="fPerson">Paid by</label>
          <select id="fPerson"></select>
        </div>
        <div class="field">
          <label id="fCostLab">Fixed or variable</label>
          <div class="seg" id="fCost" role="group" aria-label="Fixed or variable"></div>
        </div>
      </div>
      <div class="field" id="scopeWrap">
        <label for="fScope">Budget applies to</label>
        <select id="fScope">
          <option value="all">Every month</option>
          <option value="one">This month only</option>
        </select>
        <span class="hint">A one-month figure leaves the standing budget alone.</span>
      </div>
      <div class="field">
        <label for="fNote" id="fNoteLab">Note</label>
        <input type="text" id="fNote" placeholder="Optional">
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-danger" id="mDelete" hidden>Delete</button>
      <span style="flex:1 1 10px"></span>
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================ constants ============================ */
var MONTHS=["January","February","March","April","May","June",
            "July","August","September","October","November","December"];
var MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var LAST_YEAR=2030;
var CATEGORIES=["Home","Utilities","Food","Transport","Insurance","Health","Childcare",
                "Debt and loans","Leisure","Shopping","Subscriptions","Giving","Other"];
var GROUPS=[
  {k:"essential",    label:"Essential",     hint:"Rent, food, utilities, insurance — the bills that do not negotiate."},
  {k:"nonessential", label:"Non-essential", hint:"Eating out, subscriptions, days out — the part you could cut if you had to."}
];

var CUR=new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",
        minimumFractionDigits:0,maximumFractionDigits:0});
var CUR2=new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",
        minimumFractionDigits:2,maximumFractionDigits:2});
function money(n){ var v=Math.round(n||0); return (v<0?"−":"")+CUR.format(Math.abs(v)); }
function money2(n){ var v=n||0; return (v<0?"−":"")+CUR2.format(Math.abs(v)); }

var IDB_NAME="budget_console", IDB_VER=1, idb=null;
var SEED_TS="2000-01-01T00:00:00.000Z";
var SCHEMA=2;                       /* 1 = categories + transactions, 2 = lines */

/* ============================ state ============================ */
var db=null, unsub=null;
var records=[], rows=[];
var cloudSync=true, lastSyncAt=null, pushedAt={}, inflight=0;
var persistMode="loading";
var storageInfo={engine:"connecting…",bytes:null,persisted:null};
var editing=null, draft={};
var quickDraft={};
var now=new Date();
var view={page:"dash", scope:"month", year:now.getFullYear(), month:now.getMonth(), dwhole:false, person:"all"};

function $(s){ return document.querySelector(s); }
function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }
function uid(){ return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function bodyOf(r){ var b={}; for(var k in r){ if(k!=="id") b[k]=r[k]; } return b; }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function monthKey(y,m){ return y+"-"+pad(m+1); }
function quarterOf(m){ return Math.floor(m/3); }

/* the months the current scope covers: one, or a quarter's three */
function monthsInScope(){
  if(view.scope==="quarter"){
    var q=quarterOf(view.month), out=[];
    for(var i=0;i<3;i++) out.push(monthKey(view.year,q*3+i));
    return out;
  }
  return [monthKey(view.year,view.month)];
}
function scopeLabel(){
  return view.scope==="quarter"
    ? "Q"+(quarterOf(view.month)+1)+" "+view.year
    : MONTHS[view.month]+" "+view.year;
}

/* ============================ selectors ============================ */
function lines(){
  return rows.filter(function(r){ return r.kind==="line"; })
    .sort(function(a,b){ return (a.order||0)-(b.order||0) || (a.name||"").localeCompare(b.name||""); });
}
function pots(){
  return rows.filter(function(r){ return r.kind==="pot"; })
    .sort(function(a,b){ return (a.order||0)-(b.order||0) || (a.name||"").localeCompare(b.name||""); });
}
function groupOf(l){ return l.group==="nonessential"?"nonessential":"essential"; }

/* one month's planned figure: the override for that month, else the standing one */
function budgetIn(l,key){
  var o=l.budgets&&l.budgets[key];
  return typeof o==="number"?o:num(l.budget);
}
function actualIn(l,key){ return num(l.actuals&&l.actuals[key]); }

/* summed across whatever the scope covers */
function budgetOf(l){
  return monthsInScope().reduce(function(s,k){ return s+budgetIn(l,k); },0);
}
function actualOf(l){
  return monthsInScope().reduce(function(s,k){ return s+actualIn(l,k); },0);
}
function totals(){
  var t={budget:0,actual:0,ess:{budget:0,actual:0},non:{budget:0,actual:0},over:0,count:0};
  lines().forEach(function(l){
    var b=budgetOf(l), a=actualOf(l), g=groupOf(l)==="essential"?t.ess:t.non;
    t.budget+=b; t.actual+=a; g.budget+=b; g.actual+=a;
    if(a>b) t.over++;
    t.count++;
  });
  t.left=t.budget-t.actual;
  return t;
}
/* planned against actual per category, for the variance chart */
function byCategory(){
  var m={};
  lines().forEach(function(l){
    var c=CATEGORIES.indexOf(l.category)>=0?l.category:"Other";
    if(!m[c]) m[c]={name:c,budget:0,actual:0};
    m[c].budget+=budgetOf(l); m[c].actual+=actualOf(l);
  });
  return Object.keys(m).map(function(k){
    var x=m[k]; x.variance=x.budget-x.actual; return x;
  }).filter(function(x){ return x.budget>0||x.actual>0; })
    .sort(function(a,b){ return a.variance-b.variance; });
}
function movesOf(potId){
  return rows.filter(function(r){ return r.kind==="move" && r.potId===potId; })
    .sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
}
function balanceOf(p){ return movesOf(p.id).reduce(function(s,m){ return s+num(m.amount); },0); }

/* ============================ samples ============================ */
function sampleRows(){
  var k=monthKey(now.getFullYear(),now.getMonth());
  function base(o){ o.sample=true; o.deleted=false; o.schema=SCHEMA;
                    o.createdAt=nowIso(); o.updatedAt=SEED_TS; return o; }
  function line(id,name,cat,group,budget,actual,order,note){

/* ====================== IndexedDB ====================== */
function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB) return rej(new Error("IndexedDB unavailable"));
    var req; try{ req=indexedDB.open(IDB_NAME,IDB_VER); }catch(e){ return rej(e); }
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains("records")){
        var s=d.createObjectStore("records",{keyPath:"id"});
        s.createIndex("kind","kind",{unique:false});
        s.createIndex("updatedAt","updatedAt",{unique:false});
      }
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"k"});
    };
    req.onsuccess=function(){ res(req.result); };
    req.onerror=function(){ rej(req.error||new Error("open failed")); };
    req.onblocked=function(){ rej(new Error("another tab is upgrading the database")); };
  });
}
function idbTx(store,mode,fn){
  return new Promise(function(res,rej){
    if(!idb) return rej(new Error("no local database"));
    var tx,os,r;
    try{ tx=idb.transaction(store,mode); os=tx.objectStore(store); r=fn(os); }catch(e){ return rej(e); }
    tx.oncomplete=function(){ res(r&&"result" in r?r.result:undefined); };
    tx.onerror=function(){ rej(tx.error||new Error("transaction failed")); };
    tx.onabort=function(){ rej(tx.error||new Error("transaction aborted")); };
  });
}
function idbPut(s,v){ return idbTx(s,"readwrite",function(os){ return os.put(v); }); }
function idbGet(s,k){ return idbTx(s,"readonly",function(os){ return os.get(k); }); }
function idbAll(s){ return idbTx(s,"readonly",function(os){ return os.getAll(); }); }
function idbPutMany(s,vs){ return idbTx(s,"readwrite",function(os){ vs.forEach(function(v){os.put(v);}); return null; }); }
function idbDelMany(s,ks){ return idbTx(s,"readwrite",function(os){ ks.forEach(function(k){os.delete(k);}); return null; }); }
function idbClear(s){ return idbTx(s,"readwrite",function(os){ return os.clear(); }); }

/* ====================== migration from the old shape ======================
   Version 1 held categories with a standing budget and a stream of dated
   transactions. Version 2 holds one line per expense with a budget and an
   actual per month. A category becomes a line; its transactions are summed
   into the month they fell in. Individual transactions are not carried over
   — the monthly total is what the new shape keeps. Pots are untouched. */
function migrate(){
  var cats=records.filter(function(r){ return r.kind==="cat" && !r.deleted; });
  if(!cats.length) return 0;
  var entries=records.filter(function(r){ return r.kind==="entry" && !r.deleted; });
  var written=[], n=0;

  cats.forEach(function(c){
    var actuals={};
    entries.filter(function(e){ return e.catId===c.id; }).forEach(function(e){
      var k=(e.date||"").slice(0,7);
      if(!/^\d{4}-\d{2}$/.test(k)) return;
      actuals[k]=(actuals[k]||0)+num(e.amount);
    });
    var line={
      id:c.id, kind:"line", name:c.name||"Untitled", category:"Other", group:"essential",
      budget:num(c.budget), budgets:c.budgets||{}, actuals:actuals,
      note:c.note||"", order:c.order||0, deleted:false, schema:SCHEMA,
      createdAt:c.createdAt||nowIso(), updatedAt:nowIso()
    };
    if(c.sample) line.sample=true;
    putRecord(line); written.push(line); n++;
  });
  /* the transactions have been folded in; tombstone them so other devices agree */
  entries.forEach(function(e){
    var t={id:e.id,deleted:true,updatedAt:nowIso(),sample:!!e.sample};
    putRecord(t); written.push(t);
  });
  if(written.length){
    if(idb) idbPutMany("records",written).catch(function(){});
    written.forEach(pushOne);
  }
  return n;
}

/* ============================ writes ============================ */

function putRecord(r){

}
function setSaveState(s,detail){
  var pill=$("#savepill"), txt=$("#savetext");
  if(!pill) return;
  if(s==="saving"){ pill.dataset.s="saving"; txt.textContent="Saving…"; return; }
  if(s==="error"){ pill.dataset.s="error"; txt.textContent=(detail||"Not saved"); return; }
  if(!idb){ pill.dataset.s="error"; txt.textContent="No local database"; return; }
  if(persistMode==="db"&&cloudSync){ pill.dataset.s="saved"; txt.textContent="Saved · synced"; }
  else { pill.dataset.s="local"; txt.textContent="Saved locally"; }
}
function writeRecord(r){
  r.updatedAt=nowIso();
  putRecord(r); refreshView(); render();
  if(!idb){ setSaveState("error","No local database"); return Promise.resolve(); }
  inflight++; setSaveState("saving");
  return idbPut("records",r).then(function(){
    if(--inflight<=0){ inflight=0; setSaveState(); }
    pushOne(r); afterWrite();
  }).catch(function(e){
    inflight=Math.max(0,inflight-1);
    setSaveState("error","Local write failed · "+((e&&(e.name||e.message))||"error"));
  });
}
function save(r){ r.deleted=false; delete r.sample; return writeRecord(r); }
function remove(id){
  var ex=records.find(function(x){ return x.id===id; });
  return writeRecord({id:id,deleted:true,sample:!!(ex&&ex.sample)});
}
function removePot(id){
  movesOf(id).map(function(m){ return m.id; }).forEach(remove);
  return remove(id);
}

/* ====================== mirror to the artifact store ====================== */
function pushOne(r){
  if(!(persistMode==="db"&&db&&cloudSync)) return;
  if(pushedAt[r.id]===r.updatedAt) return;
  pushedAt[r.id]=r.updatedAt;
  db.collection("records").doc(r.id).set(bodyOf(r)).then(function(){
    lastSyncAt=nowIso(); renderStorage();
  }).catch(function(e){
    delete pushedAt[r.id];
    setSaveState("error","Saved locally · sync "+((e&&e.code)||"failed"));
  });
}
function applySnapshot(snap){
  if(!cloudSync) return;
  var wasEmpty=records.length===0;
  var cloud=snap.docs.map(function(d){ var o=d.data()||{}; o.id=d.id; return o; });
  var byId={}; records.forEach(function(r){ byId[r.id]=r; });
  var toLocal=[], toCloud=[];
  cloud.forEach(function(c){
    var l=byId[c.id];
    if(!l || (c.updatedAt||"")>(l.updatedAt||"")) toLocal.push(c);
    else if((l.updatedAt||"")>(c.updatedAt||"")) toCloud.push(l);
    else pushedAt[c.id]=c.updatedAt;
    delete byId[c.id];
  });
  Object.keys(byId).forEach(function(id){ toCloud.push(byId[id]); });
  if(toLocal.length){
    toLocal.forEach(function(c){ putRecord(c); pushedAt[c.id]=c.updatedAt; });
    if(idb) idbPutMany("records",toLocal).catch(function(){});
    refreshView();
    if(migrate()) refreshView();
    render();
    if(wasEmpty){
      var live=toLocal.filter(function(r){ return !r.deleted; }).length;
      if(live) flashStatus("Restored "+live+" records from your account into this device's local database.");
    }
  }
  toCloud.forEach(pushOne);
  lastSyncAt=nowIso(); renderStorage();
}
function purgeTombstones(){
  var cut=new Date(Date.now()-30*86400000).toISOString();
  var old=records.filter(function(r){ return r.deleted && (r.updatedAt||"")<cut; });
  if(!old.length) return;
  var ids=old.map(function(r){ return r.id; });
  records=records.filter(function(r){ return ids.indexOf(r.id)<0; });
  if(idb) idbDelMany("records",ids).catch(function(){});
}
function requestPersistence(){
  if(!navigator.storage) return;
  if(navigator.storage.persisted){
    navigator.storage.persisted().then(function(p){
      storageInfo.persisted=p;
      if(!p&&navigator.storage.persist) return navigator.storage.persist().then(function(g){ storageInfo.persisted=g; });
    }).then(renderStorage).catch(function(){});
  }
  if(navigator.storage.estimate){
    navigator.storage.estimate().then(function(e){ storageInfo.bytes=e.usage||0; renderStorage(); }).catch(function(){});
  }
}
function setCloudSync(on){
  cloudSync=on;
  if(idb) idbPut("meta",{k:"sync",v:on}).catch(function(){});
  if(on&&db){ subscribe(); records.forEach(pushOne); }
  else if(!on&&unsub){ unsub(); unsub=null; }
  render();
}

  if(i.actuals && typeof i.actuals[ym]==="number") return i.actuals[ym];
  var from=i.from||(i.createdAt||"").slice(0,7)||ym;
  if(ym<from || ym>ymNow() || (i.to && ym>i.to)) return 0;
  return num(i.amount);

   month records something different */

  if(L.payments && typeof L.payments[ym]==="number") return L.payments[ym];
  var from=L.from||(L.createdAt||"").slice(0,7)||ym;

/* donut from segments; a 2px surface gap separates them */
function donut(segs,opt){
  opt=opt||{}; var S=120, R=opt.r||46, T=opt.t||15, C=2*Math.PI*R;
  var svg=svgEl("svg",{viewBox:"0 0 "+S+" "+S,role:"img","aria-label":opt.label||""});
  svgEl("circle",{cx:S/2,cy:S/2,r:R,fill:"none",stroke:"var(--sunken)","stroke-width":T},svg);
  var tot=segs.reduce(function(s,x){ return s+Math.max(0,x.v); },0), off=0, gap=segs.filter(function(x){return x.v>0;}).length>1?2.5:0;
  if(tot>0) segs.forEach(function(sg){
    var len=Math.max(0,sg.v)/tot*C; if(len<=0) return;
    var c=svgEl("circle",{cx:S/2,cy:S/2,r:R,fill:"none",stroke:sg.c,"stroke-width":T,
      "stroke-dasharray":Math.max(0,len-gap)+" "+(C-Math.max(0,len-gap)),"stroke-dashoffset":-off,
      transform:"rotate(-90 "+S/2+" "+S/2+")"},svg);
    c.addEventListener("mousemove",function(e){ showTip(e,sg.label,[{k:money(sg.v),v:Math.round(sg.v/tot*100)+"%",c:sg.c}]); });
    c.addEventListener("mouseleave",hideTip);
    off+=len;
  });
  if(opt.c1!=null){ var t1=svgEl("text",{x:S/2,y:S/2+(opt.c2?2:6),"text-anchor":"middle",class:"dc1"},svg); t1.textContent=opt.c1; }
  if(opt.c2){ var t2=svgEl("text",{x:S/2,y:S/2+17,"text-anchor":"middle",class:"dc2"},svg); t2.textContent=opt.c2; }
  if(opt.c0){ var t0=svgEl("text",{x:S/2,y:S/2-16,"text-anchor":"middle",class:"dc2"},svg); t0.textContent=opt.c0; }
  return svg;
}

/* ============================ render ============================ */
function render(){
  renderPageNav();
  renderPeriodNav();
  var body=$("#pageBody"); body.textContent="";
  if(view.page==="dash") renderDash(body);
  else if(view.page==="month") renderBudget(body);
  else if(view.page==="income") renderIncome(body);
  else if(view.page==="loans") renderLoans(body);
  else renderPots(body);
  renderStorage();
  $("#newBtn").textContent = {dash:"New expense",month:"New expense",income:"New income",loans:"New loan",pots:"New pot"}[view.page]||"New";
}
function renderPageNav(){
  var box=$("#pagenav"); box.textContent="";
  [["dash","Dashboard"],["month","Budget"],["income","Income"],["pots","Pots"],["loans","Loans"]].forEach(function(p){
    var b=el("button",null,p[1]); b.type="button";
    b.setAttribute("aria-pressed",view.page===p[0]?"true":"false");
    b.onclick=function(){ view.page=p[0]; render(); };
    box.appendChild(b);
  });
}
function yearOptions(){
  var y0=new Date().getFullYear()-1, out=[], y;
  for(y=y0;y<=LAST_YEAR;y++) out.push(y);
  if(out.indexOf(view.year)<0) out.unshift(view.year);
  return out;
}
function renderPeriodNav(){
  var box=$("#periodnav"); box.textContent="";
  box.hidden=(view.page==="dash");
  if(view.page==="dash") return;
  if(view.page==="pots"){
    box.appendChild(el("span","navnote","Pots run across every month — the balance is everything paid in"));
    return;
  }
  if(view.page==="loans"){
    box.appendChild(el("span","navnote","Balances are as of today — record each month's payment to bring them down"));
    return;
  }
  /* Month, quarter and year are one period between them, so they are kept
     consistent: pick a month and the quarter follows; pick a quarter and the
     month moves inside it. The scope decides which one the figures cover. */
  var sc=el("div","scope"); sc.setAttribute("role","group");
  sc.setAttribute("aria-label","Show a month or a whole quarter");
  [["month","Month"],["quarter","Quarter"]].forEach(function(o){
    var b=el("button",null,o[1]); b.type="button";
    b.setAttribute("aria-pressed",view.scope===o[0]?"true":"false");
    b.onclick=function(){ view.scope=o[0]; render(); };
    sc.appendChild(b);
  });
  box.appendChild(sc);

  function sel(id,label,opts,val,on){
    var w=el("label","navsel");
    w.appendChild(el("span","navsellab",label));
    var s=document.createElement("select");
    s.id=id; s.className="monsel"; s.setAttribute("aria-label",label);
    opts.forEach(function(o){
      var op=document.createElement("option");
      op.value=String(o.v); op.textContent=o.t; s.appendChild(op);
    });
    s.value=String(val);
    s.onchange=function(){ on(parseInt(this.value,10)); render(); };
    w.appendChild(s); box.appendChild(w);
  }
  sel("monthSel","Month",MONTHS.map(function(t,i){ return {v:i,t:t}; }),view.month,
      function(v){ view.month=v; });
  sel("quarterSel","Quarter",[0,1,2,3].map(function(q){ return {v:q,t:"Quarter "+(q+1)}; }),
      quarterOf(view.month),
      function(q){
        var n=new Date();
        /* stay on this month if it is inside the quarter picked */
        view.month=(n.getFullYear()===view.year && quarterOf(n.getMonth())===q)
          ? n.getMonth() : q*3;
      });
  sel("yearSel","Year",yearOptions().map(function(y){ return {v:y,t:String(y)}; }),view.year,
      function(v){ view.year=v; });

  box.appendChild(el("span","navnote","showing "+scopeLabel()));
  var n2=new Date();
  if(!(view.year===n2.getFullYear()&&view.month===n2.getMonth())){
    var sp=el("span"); sp.style.flex="1 1 10px"; box.appendChild(sp);
    var t=el("button","btn btn-sm","This month");
    t.onclick=function(){ view.year=n2.getFullYear(); view.month=n2.getMonth(); render(); };
    box.appendChild(t);
  }
}

  b.appendChild(t);
  b.appendChild(el("span","grow"));

                            .map(function(r){ return r.id; }).forEach(remove); };
  b.appendChild(c);
  parent.appendChild(b);
}

function renderBudget(parent){
  var t=totals(), ls=lines();

  var panel=el("div","panel");
  var kpis=el("div","kpis");
  function kpi(label,value,sub,over){
    var k=el("div","kpi");
    k.appendChild(el("div","lbl",label));
    var v=el("div","kv",value); if(over) v.dataset.over="1";
    k.appendChild(v);
    if(sub) k.appendChild(el("div","ks",sub));
    kpis.appendChild(k);
  }
  var over=t.left<0;
  kpi("Budgeted",money(t.budget),t.count+" expense"+(t.count===1?"":"s")+" · "+scopeLabel());
  kpi("Spent",money(t.actual),
      t.budget>0?Math.round(t.actual/t.budget*100)+"% of the budget":"no budget set");
  kpi(over?"Overspent":"Left",money(Math.abs(t.left)),
      over?(t.over+" line"+(t.over===1?"":"s")+" over"):"still to spend",over);
  kpi("Essential",t.actual>0?Math.round(t.ess.actual/t.actual*100)+"%":"—",
      t.actual>0?money(t.ess.actual)+" of "+money(t.actual)+" spent":"nothing spent yet");
  panel.appendChild(kpis);

  if(t.budget>0||t.actual>0){
    var holder=el("div");
    var bar=el("div","wholebar");
    var denom=Math.max(t.budget,t.actual)||1;
    var w=Math.min(t.actual,denom)/denom*100;
    var si=el("i"); si.style.width=w.toFixed(2)+"%";
    si.style.background=over?"var(--over)":"var(--accent)";
    bar.appendChild(si);
    if(!over&&t.left>0){
      var li=el("i"); li.style.width=(100-w).toFixed(2)+"%";
      li.style.background="var(--line-2)"; bar.appendChild(li);
    }
    holder.appendChild(bar);
    var key=el("div","key");
    function ki(colour,text){
      var s=el("span"); var i=el("i"); i.style.background=colour;
      s.appendChild(i); s.appendChild(document.createTextNode(text)); key.appendChild(s);
    }
    ki(over?"var(--over)":"var(--accent)","spent "+money(t.actual));
    if(!over) ki("var(--line-2)","left "+money(Math.max(0,t.left)));
    holder.appendChild(key);
    panel.appendChild(holder);
  }

  /* essential against the rest — emphasis, not two competing hues */
  if(t.actual>0){
    var sp=el("div","split");
    sp.appendChild(el("div","lbl","Essential against the rest"));
    var sb=el("div","wholebar"); sb.style.marginTop="9px";
    [["essential",t.ess.actual,"var(--ess)"],["nonessential",t.non.actual,"var(--non)"]]
      .forEach(function(x){
        if(x[1]<=0) return;
        var seg=el("i"); seg.style.width=(x[1]/t.actual*100).toFixed(2)+"%";
        seg.style.background=x[2];
        seg.title=(x[0]==="essential"?"Essential":"Non-essential")+" — "+money2(x[1]);
        sb.appendChild(seg);
      });
    sp.appendChild(sb);
    var sk=el("div","key");
    [["Essential",t.ess.actual,"var(--ess)"],["Non-essential",t.non.actual,"var(--non)"]]
      .forEach(function(x){
        var s=el("span"); var i=el("i"); i.style.background=x[2];
        s.appendChild(i);
        s.appendChild(document.createTextNode(x[0]+" "+money(x[1])+
          " · "+Math.round(x[1]/t.actual*100)+"%"));
        sk.appendChild(s);
      });
    sp.appendChild(sk);
    panel.appendChild(sp);
  }
  parent.appendChild(panel);

  sampleBanner(parent);

  if(!ls.length){
    parent.appendChild(el("div","empty",
      "No expenses yet. Add the things you actually pay for — mortgage, groceries, insurance, eating out — each with a category, a budget and whether you could cut it."));
    var h0=el("div","grouphead");
    h0.appendChild(el("span","grow"));
    var a0=el("button","btn btn-primary","Add an expense"); a0.onclick=openNew;
    h0.appendChild(a0); parent.appendChild(h0);
    return;
  }

  /* variance by category */
  var cats=byCategory();
  if(cats.length){
    var f=el("div","figure");
    var fh=el("div","fhead");
    fh.appendChild(el("h3",null,"Under and over, by category"));
    fh.appendChild(el("span","fnote",scopeLabel()));
    fh.appendChild(el("span","grow"));
    var k2=el("div","key");
    [["var(--accent)","under budget"],["var(--over)","over"]].forEach(function(x){
      var s=el("span"); var i=el("i"); i.style.background=x[0];
      s.appendChild(i); s.appendChild(document.createTextNode(x[1])); k2.appendChild(s);
    });
    fh.appendChild(k2);
    f.appendChild(fh);
    var span=Math.max(1,Math.max.apply(null,cats.map(function(c){ return Math.abs(c.variance); })));
    cats.forEach(function(c){
      var row=el("div","dbar");
      row.appendChild(el("div","dname",c.name));
      var tr=el("div","dtrack");
      var z=el("div","zero"); z.style.left="50%"; tr.appendChild(z);
      var bar=el("i");
      bar.style.width=(Math.abs(c.variance)/span*50).toFixed(2)+"%";
      if(c.variance>=0){ bar.style.left="50%"; bar.style.background="var(--accent)"; }
      else { bar.style.right="50%"; bar.style.background="var(--over)"; }
      tr.appendChild(bar); row.appendChild(tr);
      var v=el("div","dval", (c.variance<0?"":"+")+money2(c.variance));
      if(c.variance<0) v.dataset.over="1";
      row.appendChild(v);
      row.title=c.name+" — "+money2(c.actual)+" spent of "+money2(c.budget)+" budgeted";
      f.appendChild(row);
    });
    parent.appendChild(f);
  }

  /* the lines, in their two groups */
  GROUPS.forEach(function(G){
    var set=ls.filter(function(l){ return groupOf(l)===G.k; });
    var gb=set.reduce(function(s,l){ return s+budgetOf(l); },0);
    var ga=set.reduce(function(s,l){ return s+actualOf(l); },0);
    var head=el("div","grouphead");
    var dot=el("span","gdot");
    dot.style.background=G.k==="essential"?"var(--ess)":"var(--non)";
    head.appendChild(dot);
    head.appendChild(el("h2",null,G.label));
    if(set.length) head.appendChild(el("span","gsum",money2(ga)+" of "+money(gb)));
    head.appendChild(el("span","grow"));
    var add=el("button","btn btn-sm","Add to "+G.label.toLowerCase());
    add.onclick=function(){ openNew(G.k); };
    head.appendChild(add);
    parent.appendChild(head);
    if(!set.length){
      parent.appendChild(el("div","empty","Nothing here yet."));
      return;
    }
    set.forEach(function(l){ parent.appendChild(lineCard(l)); });
  });
}

function lineCard(l){
  var b=budgetOf(l), a=actualOf(l), over=a>b, left=b-a;
  var card=el("div","line");
  card.dataset.g=groupOf(l);
  if(over) card.dataset.over="1";

  var row=el("div","lrow");
  row.appendChild(el("div","lname",l.name||"Untitled"));
  row.appendChild(el("span","lcat",l.category||"Other"));
  if(l.person && l.person!=="Shared") row.appendChild(el("span","lcat",l.person));
  var fig=el("div","lfig");
  fig.appendChild(el("b",null,money2(a)));
  fig.appendChild(document.createTextNode(" of "+money(b)));
  row.appendChild(fig);
  card.appendChild(row);

  var meter=el("div","meter");
  var fill=el("i");
  fill.style.width=(b>0?Math.min(100,a/b*100):(a>0?100:0)).toFixed(2)+"%";
  meter.appendChild(fill);
  meter.title=l.name+": "+money2(a)+" spent of "+money(b)+" budgeted";
  card.appendChild(meter);

  var acts=el("div","lacts");
  var amt=el("label","amtbox");
  amt.appendChild(el("span","navsellab", view.scope==="quarter" ? "Spent (Q)" : "Spent"));
  var inp=document.createElement("input");
  inp.type="number"; inp.step="0.01"; inp.min="0";
  inp.setAttribute("aria-label","Actual spent on "+l.name+" in "+scopeLabel());
  if(view.scope==="quarter"){
    /* a quarter is three months of figures; editing one number here would
       have to guess how to split it, so the field stays read-only */
    inp.value=a.toFixed(2); inp.disabled=true;
    inp.title="Switch to Month to change a figure — a quarter is three months added up";
  } else {
    var key=monthKey(view.year,view.month);
    inp.value=actualIn(l,key)||"";
    inp.onchange=function(){
      var c=clone(l); c.actuals=c.actuals||{};
      var v=num(this.value);
      if(this.value==="") delete c.actuals[key]; else c.actuals[key]=v;
      save(c);
    };
  }
  amt.appendChild(inp);
  acts.appendChild(amt);

  var lt=el("span","lleft", over ? money2(a-b)+" over" : money2(left)+" left");
  if(over) lt.dataset.over="1";
  acts.appendChild(lt);
  if(l.note) acts.appendChild(el("span","lnote","· "+l.note));
  acts.appendChild(el("span","grow"));
  var ed=el("button","btn btn-ghost btn-sm","Edit");
  ed.onclick=function(){ openEdit(l); };
  acts.appendChild(ed);
  card.appendChild(acts);
  return card;
}

function renderPots(parent){
  var ps=pots();
  var head=el("div","grouphead");
  head.appendChild(el("h2",null,"Savings pots"));
  head.appendChild(el("span","grow"));
  var add=el("button","btn btn-sm","Add a pot");
  add.onclick=function(){ openNewPot(); };
  head.appendChild(add);

  if(!ps.length){
    parent.appendChild(head);
    parent.appendChild(el("div","empty",
      "No pots yet. A pot is money set aside for one named thing — an emergency fund, a holiday, the next car."));
    return;
  }
  var tT=0,tB=0;
  ps.forEach(function(p){ tT+=num(p.target); tB+=balanceOf(p); });
  var panel=el("div","panel");
  var kpis=el("div","kpis");
  function kpi(l2,v,s){
    var k=el("div","kpi");
    k.appendChild(el("div","lbl",l2)); k.appendChild(el("div","kv",v));
    if(s) k.appendChild(el("div","ks",s)); kpis.appendChild(k);
  }
  kpi("Saved",money(tB),"across "+ps.length+" pot"+(ps.length===1?"":"s"));
  kpi("Targets",money(tT),tT>0?Math.round(tB/tT*100)+"% of the way there":"no targets set");
  kpi("Still to find",money(Math.max(0,tT-tB)),"to fill every pot");
  panel.appendChild(kpis);
  parent.appendChild(panel);
  parent.appendChild(head);
  ps.forEach(function(p){ parent.appendChild(potCard(p)); });
}

function potCard(p){
  var bal=balanceOf(p), target=num(p.target), pct=target>0?Math.min(1,bal/target):0;
  var card=el("div","pot");
  if(target>0&&bal>=target) card.dataset.full="1";
  var row=el("div","lrow");
  row.appendChild(el("div","lname",p.name||"Untitled pot"));
  var fig=el("div","lfig");
  fig.appendChild(el("b",null,money2(bal)));
  fig.appendChild(document.createTextNode(target>0?" of "+money(target):" saved"));
  row.appendChild(fig);
  card.appendChild(row);
  if(target>0){
    var meter=el("div","meter");
    var fill=el("i"); fill.style.width=(pct*100).toFixed(2)+"%";
    meter.appendChild(fill);
    meter.title=p.name+": "+money2(bal)+" of "+money(target);
    card.appendChild(meter);
  }
  var acts=el("div","lacts");
  acts.appendChild(el("span","ptarget", target>0
    ? Math.round(pct*100)+"% there · "+money2(Math.max(0,target-bal))+" to go"
    : "no target set"));
  if(p.note) acts.appendChild(el("span","lnote","· "+p.note));
  acts.appendChild(el("span","grow"));
  var ed=el("button","btn btn-ghost btn-sm","Edit");
  ed.onclick=function(){ openEditPot(p); };
  acts.appendChild(ed);
  card.appendChild(acts);

  var q=el("div","quick");
  var amt=document.createElement("input");
  amt.type="number"; amt.step="0.01"; amt.placeholder="Amount";
  amt.setAttribute("aria-label","Amount into "+p.name);
  var note=document.createElement("input");
  note.type="text"; note.placeholder="Note (optional)";
  note.setAttribute("aria-label","Note");
  var d=quickDraft[p.id]||{};
  amt.value=d.amount||""; note.value=d.note||"";
  function keep(){ quickDraft[p.id]={amount:amt.value,note:note.value}; }
  amt.oninput=keep; note.oninput=keep;
  function add(){
    var v=num(amt.value);
    if(!v){ amt.focus(); return; }
    delete quickDraft[p.id];
    save({id:uid(),kind:"move",potId:p.id,date:ymd(new Date()),amount:v,
          note:note.value.trim(),createdAt:nowIso(),schema:SCHEMA});
  }
  amt.onkeydown=note.onkeydown=function(e){ if(e.key==="Enter") add(); };
  var go=el("button","btn btn-sm","Add money"); go.onclick=add;
  q.appendChild(amt); q.appendChild(note); q.appendChild(go);
  q.appendChild(el("span","ptarget","A negative amount records a withdrawal"));
  card.appendChild(q);

  var ms=movesOf(p.id).slice(0,6);
  if(ms.length){
    var wrap=el("div","entries");
    ms.forEach(function(m){
      var r=el("div","entry");
      r.appendChild(el("span","edate",(m.date||"").slice(8)+" "+MON3[parseInt((m.date||"").slice(5,7),10)-1]));
      r.appendChild(el("span","enote",m.note||"—"));
      r.appendChild(el("span","eamt",money2(num(m.amount))));
      var x=el("button","rm","×"); x.type="button";
      x.setAttribute("aria-label","Remove "+money2(num(m.amount)));
      x.onclick=function(){ remove(m.id); };
      r.appendChild(x); wrap.appendChild(r);
    });
    card.appendChild(wrap);
  }
  return card;
}

  draft={kind:"line",name:"",category:"Other",group:group||"essential",budget:"",note:""};
  fillModal("New expense",false); showModal();
}
function openEdit(l){ editing=l.id; draft=clone(l); draft.group=groupOf(l);
  fillModal("Edit expense",true); showModal(); }
function openNewPot(){ editing=null; draft={kind:"pot",name:"",target:"",note:""};
  fillModal("New pot",false); showModal(); }
function openEditPot(p){ editing=p.id; draft=clone(p);
  fillModal("Edit pot",true); showModal(); }

  if(view.page==="pots") openNewPot(); else if(view.page==="income") openIncome(null);

};
