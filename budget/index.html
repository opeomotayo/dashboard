<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Budget Console — a household month in one page: budget against actual by category, who spent what, and savings pots filling up. Local-first, with optional Google Drive sync.">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  body{font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fafaf9}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Budget Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ── Budget Console ────────────────────────────────────────────────────
   A household month, read at a glance: what was planned, what has gone,
   what is left — and the savings pots filling up beside it.
   Same type and tokens as the Goal Console so the two read as one pair.
   Two people: Ope and Justina get one validated hue each (indigo and
   magenta, CVD-separated against both grounds), kept clear of the
   reserved under/watch/over status triad used on the category meters.
   ──────────────────────────────────────────────────────────────────── */
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --sunken:#F4F6FA; --raised:#FFFFFF;
  --ink:#0B1020; --ink-2:#2D3650; --muted:#5C6880; --faint:#8E99AE;
  --line:#DFE4EE; --line-2:#C7D0E0;

  --accent:#3A4FC4; --accent-ink:#3A4FC4; --accent-soft:#E7EAFB; --on-accent:#FFFFFF;

  /* reserved status marks — validated light, surface ~#fff */
  --hold:#0F7A55;  --hold-ink:#0F7A55;  --hold-soft:#E2F2EC;
  --slip:#B07D00;  --slip-ink:#8A6300;  --slip-soft:#F8EFD9;
  --stall:#C0203F; --stall-ink:#C0203F; --stall-soft:#FBE6EA;
  --off:#7A869E;   --off-ink:#5C6880;   --off-soft:#EDF0F5;
  --on-hold:#FFFFFF;

  /* who spent it — identity, not status. validated pair, light ground */
  --p1:#3A4FC4; --p1-soft:#E7EAFB;
  --p2:#B5468C; --p2-soft:#FAE8F3;

  --shadow-1:0 1px 1px rgba(11,16,32,.04), 0 2px 6px -2px rgba(11,16,32,.08);
  --shadow-2:0 2px 4px rgba(11,16,32,.05), 0 14px 28px -16px rgba(11,16,32,.22);
  --r-lg:16px; --r-md:11px; --r-sm:7px;

  --display:"Bricolage Grotesque","Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#080B14; --surface:#121826; --sunken:#0D1220; --raised:#192030;
    --ink:#E9EDF7; --ink-2:#C3CBDD; --muted:#8E99B2; --faint:#68738C;
    --line:#212A3D; --line-2:#2E3850;
    --accent:#6478DE; --accent-ink:#9AA8F6; --accent-soft:#1A2142; --on-accent:#070A14;
    --hold:#0FA37E;  --hold-ink:#45D3A8;  --hold-soft:#0E2A24;
    --slip:#BE7A1E;  --slip-ink:#E0A94B;  --slip-soft:#2B2113;
    --stall:#DC4A72; --stall-ink:#F2819C; --stall-soft:#2E1620;
    --off:#5C6882;   --off-ink:#8E99B2;   --off-soft:#171E2D;
    --on-hold:#06231A;
    --p1:#6478DE; --p1-soft:#1A2142;
    --p2:#C85C9C; --p2-soft:#2B1626;
    --shadow-1:0 1px 1px rgba(0,0,0,.5), 0 2px 8px -2px rgba(0,0,0,.6);
    --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 18px 34px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#080B14; --surface:#121826; --sunken:#0D1220; --raised:#192030;
  --ink:#E9EDF7; --ink-2:#C3CBDD; --muted:#8E99B2; --faint:#68738C;
  --line:#212A3D; --line-2:#2E3850;
  --accent:#6478DE; --accent-ink:#9AA8F6; --accent-soft:#1A2142; --on-accent:#070A14;
  --hold:#0FA37E;  --hold-ink:#45D3A8;  --hold-soft:#0E2A24;
  --slip:#BE7A1E;  --slip-ink:#E0A94B;  --slip-soft:#2B2113;
  --stall:#DC4A72; --stall-ink:#F2819C; --stall-soft:#2E1620;
  --off:#5C6882;   --off-ink:#8E99B2;   --off-soft:#171E2D;
  --on-hold:#06231A;
  --p1:#6478DE; --p1-soft:#1A2142;
  --p2:#C85C9C; --p2-soft:#2B1626;
  --shadow-1:0 1px 1px rgba(0,0,0,.5), 0 2px 8px -2px rgba(0,0,0,.6);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 18px 34px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl,.thead h3,.field label{font-family:var(--mono);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint)}

/* ── shell ─────────────────────────────────────────────────────────── */
.shell{max-width:1100px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 76px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:13px}
.brand{display:flex;align-items:baseline;gap:11px;margin-right:auto;min-width:0}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
.brand .tag{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}

.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;
  transition:background .14s,border-color .14s,color .14s,transform .08s}
.btn:hover{background:var(--sunken);color:var(--ink);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 9px}
.btn-ghost:hover{background:var(--sunken);color:var(--ink)}
.btn-sm{font-size:12.5px;padding:6px 11px}
.btn-wipe{color:var(--stall-ink);border-color:var(--stall)}
.btn-wipe:hover{background:var(--stall-soft);border-color:var(--stall);color:var(--stall-ink)}

.savepill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);white-space:nowrap}
.savepill .sdot{width:6px;height:6px;border-radius:50%;background:var(--hold);flex:none}
.savepill[data-s="saving"]{color:var(--accent-ink);border-color:var(--accent)}
.savepill[data-s="saving"] .sdot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.savepill[data-s="error"]{color:var(--stall-ink);background:var(--stall-soft);border-color:var(--stall)}
.savepill[data-s="error"] .sdot{background:var(--stall)}
.savepill[data-s="local"]{color:var(--slip-ink);background:var(--slip-soft);border-color:var(--slip)}
.savepill[data-s="local"] .sdot{background:var(--slip)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.pagenav{display:flex;gap:3px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px}
.pagenav button{border:0;background:transparent;padding:7px 15px;border-radius:7px;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .14s}
.pagenav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-1);font-weight:600}

/* ── month picker ──────────────────────────────────────────────────── */
.periodnav{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:22px}
.navsel{display:inline-flex;align-items:center;gap:7px}
.navsellab{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}
select,input[type=text],input[type=number],input[type=date]{
  width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;
  padding:9px 11px;font-size:14px;color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.monsel{width:auto;min-width:92px;font-family:var(--display);font-weight:600;font-size:14.5px;
  padding:7px 10px;letter-spacing:-.01em}
.navnote{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

/* ── headline panel ────────────────────────────────────────────────── */
.panel{display:flex;flex-direction:column;gap:19px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
  padding:22px 24px;margin-top:20px}
.kpis{display:flex;gap:30px;flex-wrap:wrap}
.kpi{min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .kv{font-family:var(--display);font-size:29px;font-weight:800;line-height:1;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:11.5px;color:var(--muted);line-height:1.35}
.kpi.left .kv[data-over="1"]{color:var(--stall-ink)}

.wholebar{display:flex;gap:2px;height:14px;border-radius:999px;overflow:hidden;background:var(--sunken)}
.wholebar i{display:block;height:100%}
.wholebar i:first-child{border-radius:999px 0 0 999px}
.wholebar i:last-child{border-radius:0 999px 999px 0}
.barkey{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.barkey span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.barkey i{width:8px;height:8px;border-radius:2px;flex:none}

.split{border-top:1px solid var(--line);padding-top:17px}

/* ── category rows ─────────────────────────────────────────────────── */
.listhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 10px}
.listhead h2{font-size:17px;font-weight:700}
.listhead .grow{flex:1 1 10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-1);padding:15px 17px;margin-bottom:10px}
.cat[data-s="bad"]{border-color:var(--stall)}
.crow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cname{font-family:var(--display);font-size:16.5px;font-weight:700;letter-spacing:-.02em;min-width:0}
.cfig{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.cfig b{color:var(--ink);font-weight:600}
.cleft{font-family:var(--mono);font-size:12px;white-space:nowrap}
.cleft[data-s="ok"]{color:var(--hold-ink)}
.cleft[data-s="warn"]{color:var(--slip-ink)}
.cleft[data-s="bad"]{color:var(--stall-ink)}
.meter{margin-top:11px;height:10px;border-radius:999px;background:var(--sunken);
  position:relative;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--hold)}
.meter[data-s="warn"] i{background:var(--slip)}
.meter[data-s="bad"] i{background:var(--stall)}
.cacts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:11px}
.cacts .grow{flex:1 1 10px}
.quick{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:11px;
  border-top:1px dashed var(--line);padding-top:11px}
.quick input[type=number]{width:104px}
.quick input[type=text]{flex:1 1 150px;min-width:0}
.quick select{width:auto;min-width:98px}

.entries{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px}
.entry{display:flex;align-items:baseline;gap:10px;padding:5px 0;font-size:13.5px}
.entry .edate{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;min-width:52px}
.entry .enote{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .eamt{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.who{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;white-space:nowrap;flex:none}
.who[data-w="p1"]{background:var(--p1-soft);color:var(--p1)}
.who[data-w="p2"]{background:var(--p2-soft);color:var(--p2)}
.rm{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;padding:2px 5px;flex:none}
.rm:hover{color:var(--stall-ink)}

/* ── pots ──────────────────────────────────────────────────────────── */
.pot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-1);padding:16px 18px;margin-bottom:10px}
.pot .meter i{background:var(--accent)}
.pot[data-full="1"] .meter i{background:var(--hold)}
.ptarget{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-md);
  padding:26px 22px;text-align:center;color:var(--muted);font-size:14px}

/* ── banner, status, settings ──────────────────────────────────────── */
.banner{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:18px;
  background:var(--slip-soft);border:1px solid var(--slip);border-radius:var(--r-md);padding:13px 16px;
  font-size:13.5px;color:var(--slip-ink)}
.banner .grow{flex:1 1 10px}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;
  background:var(--ink);color:var(--paper);padding:11px 17px;border-radius:999px;font-size:13.5px;
  box-shadow:var(--shadow-2);max-width:min(560px,92vw)}
.store{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);margin-top:30px;overflow:hidden}
.shead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.shead h2{font-size:15.5px;font-weight:700}
.engine{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
.sgrid{display:flex;gap:26px;flex-wrap:wrap;padding:15px 18px}
.scell{min-width:0}
.scell .k{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.scell .v{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.sactions{padding:15px 18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.snote{margin:0;padding:0 18px 16px;font-size:12.5px;color:var(--muted)}

/* ── modal ─────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(8,11,20,.55);backdrop-filter:blur(3px);
  z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);width:min(540px,100%)}
.mhead{padding:18px 20px 0}
.mhead h2{font-size:18px;font-weight:700}
.mbody{padding:16px 20px;display:flex;flex-direction:column;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field .hint{font-size:12px;color:var(--muted)}
.row2{display:flex;gap:13px;flex-wrap:wrap}
.row2 .field{flex:1 1 150px;min-width:0}
.mfoot{display:flex;gap:9px;padding:15px 20px 18px;border-top:1px solid var(--line)}
.mfoot .btn-danger{margin-right:auto;color:var(--stall-ink);border-color:var(--stall)}
.mfoot .btn-danger:hover{background:var(--stall-soft)}

@media(max-width:600px){
  .kpis{gap:20px}
  .kpi .kv{font-size:25px}
  .cfig{margin-left:0;flex-basis:100%}
}
</style>


</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>Budget Console</h1>
      <span class="tag" id="todayTag"></span>
    </div>
    <div class="pagenav" id="pagenav"></div>
    <span class="savepill" id="savepill" data-s="saved">
      <span class="sdot"></span><span id="savetext">Saved</span>
    </span>
    <button class="btn btn-sm" id="exportBtn">Export</button>
    <button class="btn btn-primary" id="newBtn">New category</button>
  </div>
</div>

<div class="shell">
  <div class="periodnav" id="periodnav"></div>
  <div id="pageBody"></div>

  <section class="store">
    <div class="shead">
      <h2 id="storeH">Local database</h2>
      <span class="engine" id="engineChip">connecting…</span>
    </div>
    <div class="sgrid" id="sgrid"></div>
    <div class="sactions">
      <label class="switch" for="syncToggle">
        <input type="checkbox" id="syncToggle">
        <span>Sync across my devices</span>
      </label>
      <button class="btn btn-sm" id="syncNowBtn">Sync now</button>
      <span style="flex:1 1 20px"></span>
      <button class="btn btn-sm" id="importBtn">Import</button>
      <button class="btn btn-sm" id="exportBtn2">Export</button>
      <button class="btn btn-sm btn-wipe" id="wipeBtn">Wipe database</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="snote" id="snote"></p>
  </section>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead"><h2 id="mTitle">New category</h2></div>
    <div class="mbody">
      <div class="field">
        <label for="fName" id="fNameLab">Name</label>
        <input type="text" id="fName" placeholder="Groceries">
      </div>
      <div class="row2">
        <div class="field">
          <label for="fAmount" id="fAmountLab">Monthly budget</label>
          <input type="number" id="fAmount" min="0" step="any" placeholder="400">
          <span class="hint" id="fAmountHint">What you plan to spend here each month.</span>
        </div>
        <div class="field" id="monthOnlyWrap">
          <label for="fScope">Applies to</label>
          <select id="fScope">
            <option value="all">Every month</option>
            <option value="one">This month only</option>
          </select>
          <span class="hint">A one-month figure leaves the standing budget alone.</span>
        </div>
      </div>
      <div class="field">
        <label for="fNote" id="fNoteLab">Note</label>
        <input type="text" id="fNote" placeholder="Optional">
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-danger" id="mDelete" hidden>Delete</button>
      <span style="flex:1 1 10px"></span>
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================ constants ============================ */
var PEOPLE=["Ope","Justina"];
var MONTHS=["January","February","March","April","May","June",
            "July","August","September","October","November","December"];
var YEAR_SPAN=5;
var CUR=new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",
        minimumFractionDigits:0,maximumFractionDigits:0});
var CUR2=new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",
        minimumFractionDigits:2,maximumFractionDigits:2});
function money(n){ return CUR.format(Math.round(n||0)); }
function money2(n){ return CUR2.format(n||0); }

var IDB_NAME="budget_console", IDB_VER=1, idb=null;
var SEED_TS="2000-01-01T00:00:00.000Z";
var SCHEMA=1;

/* ============================ state ============================ */
var db=null, unsub=null;
var records=[];           // every row, tombstones included

function $(s){ return document.querySelector(s); }
function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }
function uid(){ return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function bodyOf(r){ var b={}; for(var k in r){ if(k!=="id") b[k]=r[k]; } return b; }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }

function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYmd(s){
  if(!s||typeof s!=="string") return null;
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(!m) return null;
  return new Date(+m[1],+m[2]-1,+m[3]);
}
function monthKey(y,m){ return y+"-"+pad(m+1); }
function viewKey(){ return monthKey(view.year,view.month); }
function viewLabel(){ return MONTHS[view.month]+" "+view.year; }
function shortDate(s){
  var d=parseYmd(s); if(!d) return "";
  return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3);
}
function whoSlot(w){ return w===PEOPLE[1]?"p2":"p1"; }

/* ============================ selectors ============================ */
function of(kind){ return rows.filter(function(r){ return r.kind===kind; }); }
function cats(){
  return of("cat").sort(function(a,b){
    return (a.order||0)-(b.order||0) || (a.name||"").localeCompare(b.name||"");
  });
}
function pots(){
  return of("pot").sort(function(a,b){
    return (a.order||0)-(b.order||0) || (a.name||"").localeCompare(b.name||"");
  });
}
/* a category's budget for the month in view — a one-month override, else the standing figure */
function budgetOf(c){
  var o=c.budgets&&c.budgets[viewKey()];
  return typeof o==="number"?o:num(c.budget);
}
function inView(dateStr){
  var d=parseYmd(dateStr);
  return !!d && d.getFullYear()===view.year && d.getMonth()===view.month;
}
function entriesOf(catId){
  return of("entry").filter(function(e){ return e.catId===catId && inView(e.date); })
    .sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
}
function spentOf(c){
  return entriesOf(c.id).reduce(function(s,e){ return s+num(e.amount); },0);
}
function movesOf(potId){
  return of("move").filter(function(m){ return m.potId===potId; })
    .sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
}
function balanceOf(p){
  return movesOf(p.id).reduce(function(s,m){ return s+num(m.amount); },0);
}
/* under / watch / over, as a budget reads: spending less is the good end */
function catStatus(spent,budget){
  if(budget<=0) return spent>0?"bad":"ok";
  var r=spent/budget;
  if(r>1.0001) return "bad";
  if(r>=0.85) return "warn";
  return "ok";
}
function monthElapsed(){
  var s=new Date(view.year,view.month,1), e=new Date(view.year,view.month+1,1), t=new Date();
  if(t<=s) return 0;
  if(t>=e) return 1;
  return (t-s)/(e-s);
}
function monthTotals(){
  var cs=cats(), budget=0, spent=0, byWho={};
  PEOPLE.forEach(function(p){ byWho[p]=0; });
  cs.forEach(function(c){
    budget+=budgetOf(c);
    entriesOf(c.id).forEach(function(e){
      var a=num(e.amount); spent+=a;
      var w=PEOPLE.indexOf(e.who)>=0?e.who:PEOPLE[0];
      byWho[w]+=a;
    });
  });
  return {budget:budget, spent:spent, left:budget-spent, byWho:byWho, count:cs.length};
}

/* ====================== IndexedDB primitives ====================== */
function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB) return rej(new Error("IndexedDB unavailable"));
    var req;
    try{ req=indexedDB.open(IDB_NAME,IDB_VER); }catch(e){ return rej(e); }
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains("records")){
        var s=d.createObjectStore("records",{keyPath:"id"});
        s.createIndex("kind","kind",{unique:false});
        s.createIndex("updatedAt","updatedAt",{unique:false});
      }
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"k"});
    };
    req.onsuccess=function(){ res(req.result); };
    req.onerror=function(){ rej(req.error||new Error("open failed")); };
    req.onblocked=function(){ rej(new Error("another tab is upgrading the database")); };
  });
}
function idbTx(store,mode,fn){
  return new Promise(function(res,rej){
    if(!idb) return rej(new Error("no local database"));
    var tx,os,r;
    try{ tx=idb.transaction(store,mode); os=tx.objectStore(store); r=fn(os); }catch(e){ return rej(e); }
    tx.oncomplete=function(){ res(r&&"result" in r?r.result:undefined); };
    tx.onerror=function(){ rej(tx.error||new Error("transaction failed")); };
    tx.onabort=function(){ rej(tx.error||new Error("transaction aborted")); };
  });
}
function idbPut(s,v){ return idbTx(s,"readwrite",function(os){ return os.put(v); }); }
function idbGet(s,k){ return idbTx(s,"readonly",function(os){ return os.get(k); }); }
function idbAll(s){ return idbTx(s,"readonly",function(os){ return os.getAll(); }); }
function idbPutMany(s,vs){ return idbTx(s,"readwrite",function(os){ vs.forEach(function(v){os.put(v);}); return null; }); }
function idbDelMany(s,ks){ return idbTx(s,"readwrite",function(os){ ks.forEach(function(k){os.delete(k);}); return null; }); }
function idbClear(s){ return idbTx(s,"readwrite",function(os){ return os.clear(); }); }

/* ============================ writes ============================ */
function refreshView(){ rows=records.filter(function(r){ return !r.deleted; }); }
function putRecord(r){
  var i=records.findIndex(function(x){ return x.id===r.id; });
  if(i<0) records.push(r); else records[i]=r;
}
var saveTimer=null;
function setSaveState(s,detail){
  var pill=$("#savepill"), txt=$("#savetext");
  if(!pill) return;
  clearTimeout(saveTimer);
  if(s==="saving"){ pill.dataset.s="saving"; txt.textContent="Saving…"; return; }
  if(s==="error"){ pill.dataset.s="error"; txt.textContent=(detail||"Not saved"); return; }
  if(!idb){ pill.dataset.s="error"; txt.textContent="No local database"; return; }
  if(persistMode==="db"&&cloudSync){ pill.dataset.s="saved"; txt.textContent="Saved · synced"; }
  else { pill.dataset.s="local"; txt.textContent="Saved locally"; }
}
function writeRecord(r){
  r.updatedAt=nowIso();
  putRecord(r); refreshView(); render();
  if(!idb){ setSaveState("error","No local database"); return Promise.resolve(); }
  inflight++; setSaveState("saving");
  return idbPut("records",r).then(function(){
    if(--inflight<=0){ inflight=0; setSaveState(); }
    pushOne(r); afterWrite();
  }).catch(function(e){
    inflight=Math.max(0,inflight-1);
    setSaveState("error","Local write failed · "+((e&&(e.name||e.message))||"error"));
  });
}
function save(r){ r.deleted=false; delete r.sample; return writeRecord(r); }
function remove(id){
  var ex=records.find(function(x){ return x.id===id; });
  return writeRecord({id:id,deleted:true,sample:!!(ex&&ex.sample)});
}
/* removing a category takes its entries with it, or they become invisible spend */
function removeCat(id){
  var kids=of("entry").filter(function(e){ return e.catId===id; }).map(function(e){ return e.id; });
  kids.forEach(remove);
  return remove(id);
}
function removePot(id){
  movesOf(id).map(function(m){ return m.id; }).forEach(remove);
  return remove(id);
}

/* ====================== mirror to the artifact store ====================== */
function pushOne(r){
  if(!(persistMode==="db"&&db&&cloudSync)) return;
  if(pushedAt[r.id]===r.updatedAt) return;
  pushedAt[r.id]=r.updatedAt;
  db.collection("records").doc(r.id).set(bodyOf(r)).then(function(){
    lastSyncAt=nowIso(); renderStorage();
  }).catch(function(e){
    delete pushedAt[r.id];
    setSaveState("error","Saved locally · sync "+((e&&e.code)||"failed"));
  });
}
function applySnapshot(snap){
  if(!cloudSync) return;
  var wasEmpty=records.length===0;
  var cloud=snap.docs.map(function(d){ var o=d.data()||{}; o.id=d.id; return o; });
  var byId={}; records.forEach(function(r){ byId[r.id]=r; });
  var toLocal=[], toCloud=[];
  cloud.forEach(function(c){
    var l=byId[c.id];
    if(!l || (c.updatedAt||"")>(l.updatedAt||"")) toLocal.push(c);
    else if((l.updatedAt||"")>(c.updatedAt||"")) toCloud.push(l);
    else pushedAt[c.id]=c.updatedAt;
    delete byId[c.id];
  });
  Object.keys(byId).forEach(function(id){ toCloud.push(byId[id]); });
  if(toLocal.length){
    toLocal.forEach(function(c){ putRecord(c); pushedAt[c.id]=c.updatedAt; });
    if(idb) idbPutMany("records",toLocal).catch(function(){});
    refreshView(); render();
    if(wasEmpty){
      var live=toLocal.filter(function(r){ return !r.deleted; }).length;
      if(live) flashStatus("Restored "+live+" records from your account into this device's local database.");
    }
  }
  toCloud.forEach(pushOne);
  lastSyncAt=nowIso(); renderStorage();
}
function purgeTombstones(){
  var cut=new Date(Date.now()-30*86400000).toISOString();
  var old=records.filter(function(r){ return r.deleted && (r.updatedAt||"")<cut; });
  if(!old.length) return;
  var ids=old.map(function(r){ return r.id; });
  records=records.filter(function(r){ return ids.indexOf(r.id)<0; });
  if(idb) idbDelMany("records",ids).catch(function(){});
}
function requestPersistence(){
  if(!navigator.storage) return;
  if(navigator.storage.persisted){
    navigator.storage.persisted().then(function(p){
      storageInfo.persisted=p;
      if(!p&&navigator.storage.persist) return navigator.storage.persist().then(function(g){ storageInfo.persisted=g; });
    }).then(renderStorage).catch(function(){});
  }
  if(navigator.storage.estimate){
    navigator.storage.estimate().then(function(e){ storageInfo.bytes=e.usage||0; renderStorage(); }).catch(function(){});
  }
}
function setCloudSync(on){
  cloudSync=on;
  if(idb) idbPut("meta",{k:"sync",v:on}).catch(function(){});
  if(on&&db){ subscribe(); records.forEach(pushOne); }
  else if(!on&&unsub){ unsub(); unsub=null; }
  render();
}

/* ============================ render ============================ */
function render(){
  renderPageNav();
  renderPeriodNav();
  var body=$("#pageBody"); body.textContent="";
  if(view.page==="month") renderMonth(body); else renderPots(body);
  renderStorage();
  $("#newBtn").textContent = view.page==="month" ? "New category" : "New pot";
}

function renderPageNav(){
  var box=$("#pagenav"); box.textContent="";
  [["month","Month"],["pots","Pots"]].forEach(function(p){
    var b=el("button",null,p[1]); b.type="button";
    b.setAttribute("aria-pressed",view.page===p[0]?"true":"false");
    b.onclick=function(){ view.page=p[0]; render(); };
    box.appendChild(b);
  });
}

function yearOptions(){
  var y0=new Date().getFullYear()-1, out=[], i;
  for(i=0;i<YEAR_SPAN+1;i++) out.push(y0+i);
  if(out.indexOf(view.year)<0) out.unshift(view.year);
  return out;
}
function renderPeriodNav(){
  var box=$("#periodnav"); box.textContent="";
  if(view.page!=="month"){
    box.appendChild(el("span","navnote","Pots run across every month — the balance is all the money you have put in"));
    return;
  }
  function sel(id,label,opts,val,on){
    var w=el("label","navsel");
    w.appendChild(el("span","navsellab",label));
    var s=document.createElement("select");
    s.id=id; s.className="monsel"; s.setAttribute("aria-label",label);
    opts.forEach(function(o){
      var op=document.createElement("option");
      op.value=String(o.v); op.textContent=o.t; s.appendChild(op);
    });
    s.value=String(val);
    s.onchange=function(){ on(parseInt(this.value,10)); render(); };
    w.appendChild(s); box.appendChild(w);
  }
  sel("monthSel","Month",MONTHS.map(function(t,i){ return {v:i,t:t}; }),view.month,
      function(v){ view.month=v; });
  sel("yearSel","Year",yearOptions().map(function(y){ return {v:y,t:String(y)}; }),view.year,
      function(v){ view.year=v; });
  box.appendChild(el("span","navnote",Math.round(monthElapsed()*100)+"% of "+viewLabel()+" gone"));
  var n=new Date();
  if(!(view.year===n.getFullYear()&&view.month===n.getMonth())){
    var sp=el("span"); sp.style.flex="1 1 10px"; box.appendChild(sp);
    var t=el("button","btn btn-sm","This month");
    t.onclick=function(){ view.year=n.getFullYear(); view.month=n.getMonth(); render(); };
    box.appendChild(t);
  }
}

function sampleBanner(parent){
  if(!rows.some(function(r){ return r.sample; })) return;
  var b=el("div","banner");
  var t=el("span");
  t.appendChild(el("strong",null,"These are example figures."));
  t.appendChild(document.createTextNode(" They show how the console works. Replace or clear them when you are ready."));
  b.appendChild(t);
  b.appendChild(el("span","grow"));
  var c=el("button","btn btn-sm","Clear examples");
  c.onclick=function(){ rows.filter(function(r){ return r.sample; })
                            .map(function(r){ return r.id; }).forEach(remove); };
  b.appendChild(c);
  parent.appendChild(b);
}

function renderMonth(parent){
  var t=monthTotals(), cs=cats();

  /* ── headline panel ── */
  var panel=el("div","panel");
  var kpis=el("div","kpis");
  function kpi(label,value,sub,cls,over){
    var k=el("div","kpi"+(cls?" "+cls:""));
    k.appendChild(el("div","lbl",label));
    var v=el("div","kv",value); if(over) v.dataset.over="1";
    k.appendChild(v);
    if(sub) k.appendChild(el("div","ks",sub));
    kpis.appendChild(k);
  }
  var over=t.left<0;
  kpi("Budgeted",money(t.budget),t.count+" categor"+(t.count===1?"y":"ies"));
  kpi("Spent",money(t.spent),
      t.budget>0?Math.round(t.spent/t.budget*100)+"% of the budget":"no budget set");
  kpi(over?"Overspent":"Left",money(Math.abs(t.left)),
      over?"more than planned in "+viewLabel()
          :Math.round(monthElapsed()*100)+"% of the month gone","left",over);
  panel.appendChild(kpis);

  /* part-to-whole: what has gone against what was planned */
  if(t.budget>0||t.spent>0){
    var holder=el("div");
    var bar=el("div","wholebar");
    var denom=Math.max(t.budget,t.spent)||1;
    var spentW=Math.min(t.spent,denom)/denom*100;
    var si=el("i"); si.style.width=spentW.toFixed(2)+"%";
    si.style.background=over?"var(--stall)":"var(--accent)";
    bar.appendChild(si);
    if(!over&&t.left>0){
      var li=el("i"); li.style.width=(100-spentW).toFixed(2)+"%";
      li.style.background="var(--line-2)";
      bar.appendChild(li);
    }
    holder.appendChild(bar);
    var key=el("div","barkey");
    function keyItem(colour,text){
      var s=el("span"); var i=el("i"); i.style.background=colour;
      s.appendChild(i); s.appendChild(document.createTextNode(text)); key.appendChild(s);
    }
    keyItem(over?"var(--stall)":"var(--accent)","spent "+money(t.spent));
    if(!over) keyItem("var(--line-2)","left "+money(Math.max(0,t.left)));
    holder.appendChild(key);
    panel.appendChild(holder);
  }

  /* who spent it — two directly-labelled segments, identity not status */
  if(t.spent>0){
    var sp=el("div","split");
    sp.appendChild(el("div","lbl","Who spent it"));
    var sbar=el("div","wholebar"); sbar.style.marginTop="9px";
    PEOPLE.forEach(function(p,i){
      var v=t.byWho[p]||0; if(v<=0) return;
      var seg=el("i"); seg.style.width=(v/t.spent*100).toFixed(2)+"%";
      seg.style.background=i===0?"var(--p1)":"var(--p2)";
      seg.title=p+" — "+money2(v);
      sbar.appendChild(seg);
    });
    sp.appendChild(sbar);
    var skey=el("div","barkey");
    PEOPLE.forEach(function(p,i){
      var v=t.byWho[p]||0;
      var s=el("span"); var ic=el("i");
      ic.style.background=i===0?"var(--p1)":"var(--p2)";
      s.appendChild(ic);
      s.appendChild(document.createTextNode(p+" "+money(v)+
        " · "+Math.round(v/t.spent*100)+"%"));
      skey.appendChild(s);
    });
    sp.appendChild(skey);
    panel.appendChild(sp);
  }
  parent.appendChild(panel);

  sampleBanner(parent);

  /* ── the categories ── */
  var head=el("div","listhead");
  head.appendChild(el("h2",null,"Categories"));
  head.appendChild(el("span","grow"));
  var add=el("button","btn btn-sm","Add a category");
  add.onclick=openNewCat;
  head.appendChild(add);
  parent.appendChild(head);

  if(!cs.length){
    parent.appendChild(el("div","empty",
      "No categories yet. Add the things you actually spend on each month — food, car, children — and give each one a figure."));
    return;
  }
  cs.forEach(function(c){ parent.appendChild(catCard(c)); });
}

function catCard(c){
  var budget=budgetOf(c), spent=spentOf(c), left=budget-spent;
  var st=catStatus(spent,budget);
  var card=el("div","cat"); card.dataset.s=st;

  var row=el("div","crow");
  row.appendChild(el("div","cname",c.name||"Untitled"));
  var fig=el("div","cfig");
  fig.appendChild(el("b",null,money2(spent)));
  fig.appendChild(document.createTextNode(" of "+money(budget)));
  row.appendChild(fig);
  card.appendChild(row);

  var meter=el("div","meter"); meter.dataset.s=st;
  var fill=el("i");
  fill.style.width=(budget>0?Math.min(100,spent/budget*100):(spent>0?100:0)).toFixed(2)+"%";
  meter.appendChild(fill);
  meter.title=c.name+": "+money2(spent)+" spent of "+money(budget)+" budgeted";
  card.appendChild(meter);

  var acts=el("div","cacts");
  var lt=el("span","cleft", left>=0 ? money2(left)+" left" : money2(-left)+" over");
  lt.dataset.s=st;
  acts.appendChild(lt);
  if(c.note) acts.appendChild(el("span","ptarget","· "+c.note));
  acts.appendChild(el("span","grow"));
  var ed=el("button","btn btn-ghost btn-sm","Edit");
  ed.onclick=function(){ openEditCat(c); };
  acts.appendChild(ed);
  card.appendChild(acts);

  /* quick add */
  var q=el("div","quick");
  var amt=document.createElement("input");
  amt.type="number"; amt.min="0"; amt.step="0.01"; amt.placeholder="Amount";
  amt.setAttribute("aria-label","Amount spent on "+c.name);
  var note=document.createElement("input");
  note.type="text"; note.placeholder="What it was";
  note.setAttribute("aria-label","Note");
  var who=document.createElement("select");
  who.setAttribute("aria-label","Who paid");
  PEOPLE.forEach(function(p){
    var o=document.createElement("option"); o.value=p; o.textContent=p; who.appendChild(o);
  });
  var d=quickDraft[c.id]||{};
  amt.value=d.amount||""; note.value=d.note||""; who.value=d.who||PEOPLE[0];
  function keep(){ quickDraft[c.id]={amount:amt.value,note:note.value,who:who.value}; }
  amt.oninput=keep; note.oninput=keep; who.onchange=keep;

  function add(){
    var a=num(amt.value);
    if(a<=0){ amt.focus(); return; }
    var n=new Date();
    var day=(n.getFullYear()===view.year&&n.getMonth()===view.month)
      ? ymd(n) : viewKey()+"-01";
    delete quickDraft[c.id];
    save({id:uid(),kind:"entry",catId:c.id,date:day,amount:a,
          who:who.value,note:note.value.trim(),createdAt:nowIso(),schema:SCHEMA});
  }
  amt.onkeydown=note.onkeydown=function(e){ if(e.key==="Enter") add(); };
  var go=el("button","btn btn-sm","Add");
  go.onclick=add;
  q.appendChild(amt); q.appendChild(note); q.appendChild(who); q.appendChild(go);
  card.appendChild(q);

  var es=entriesOf(c.id);
  if(es.length){
    var wrap=el("div","entries");
    es.forEach(function(e){
      var r=el("div","entry");
      r.appendChild(el("span","edate",shortDate(e.date)));
      var w=el("span","who",e.who||PEOPLE[0]); w.dataset.w=whoSlot(e.who);
      r.appendChild(w);
      r.appendChild(el("span","enote",e.note||"—"));
      r.appendChild(el("span","eamt",money2(num(e.amount))));
      var x=el("button","rm","×");
      x.type="button"; x.title="Remove this entry";
      x.setAttribute("aria-label","Remove "+money2(num(e.amount))+" on "+(e.note||"this entry"));
      x.onclick=function(){ remove(e.id); };
      r.appendChild(x);
      wrap.appendChild(r);
    });
    card.appendChild(wrap);
  }
  return card;
}

function renderPots(parent){
  var ps=pots();
  var head=el("div","listhead");
  head.appendChild(el("h2",null,"Savings pots"));
  head.appendChild(el("span","grow"));
  var add=el("button","btn btn-sm","Add a pot");
  add.onclick=openNewPot;
  head.appendChild(add);
  parent.appendChild(head);

  if(!ps.length){
    parent.appendChild(el("div","empty",
      "No pots yet. A pot is money set aside for one named thing — an emergency fund, a holiday, the next car."));
    return;
  }

  var tTarget=0,tBal=0;
  ps.forEach(function(p){ tTarget+=num(p.target); tBal+=balanceOf(p); });
  var panel=el("div","panel");
  var kpis=el("div","kpis");
  function kpi(l,v,s){
    var k=el("div","kpi");
    k.appendChild(el("div","lbl",l));
    k.appendChild(el("div","kv",v));
    if(s) k.appendChild(el("div","ks",s));
    kpis.appendChild(k);
  }
  kpi("Saved",money(tBal),"across "+ps.length+" pot"+(ps.length===1?"":"s"));
  kpi("Targets",money(tTarget),tTarget>0?Math.round(tBal/tTarget*100)+"% of the way there":"no targets set");
  kpi("Still to find",money(Math.max(0,tTarget-tBal)),"to fill every pot");
  panel.appendChild(kpis);
  parent.insertBefore(panel,head);

  ps.forEach(function(p){ parent.appendChild(potCard(p)); });
}

function potCard(p){
  var bal=balanceOf(p), target=num(p.target), pct=target>0?Math.min(1,bal/target):0;
  var card=el("div","pot");
  if(target>0&&bal>=target) card.dataset.full="1";

  var row=el("div","crow");
  row.appendChild(el("div","cname",p.name||"Untitled pot"));
  var fig=el("div","cfig");
  fig.appendChild(el("b",null,money2(bal)));
  fig.appendChild(document.createTextNode(target>0?" of "+money(target):" saved"));
  row.appendChild(fig);
  card.appendChild(row);

  if(target>0){
    var meter=el("div","meter");
    var fill=el("i"); fill.style.width=(pct*100).toFixed(2)+"%";
    meter.appendChild(fill);
    meter.title=p.name+": "+money2(bal)+" of "+money(target)+" ("+Math.round(pct*100)+"%)";
    card.appendChild(meter);
  }

  var acts=el("div","cacts");
  acts.appendChild(el("span","ptarget", target>0
    ? Math.round(pct*100)+"% there · "+money2(Math.max(0,target-bal))+" to go"
    : "no target set"));
  if(p.note) acts.appendChild(el("span","ptarget","· "+p.note));
  acts.appendChild(el("span","grow"));
  var ed=el("button","btn btn-ghost btn-sm","Edit");
  ed.onclick=function(){ openEditPot(p); };
  acts.appendChild(ed);
  card.appendChild(acts);

  var q=el("div","quick");
  var amt=document.createElement("input");
  amt.type="number"; amt.step="0.01"; amt.placeholder="Amount";
  amt.setAttribute("aria-label","Amount into "+p.name);
  var note=document.createElement("input");
  note.type="text"; note.placeholder="Note (optional)";
  note.setAttribute("aria-label","Note");
  var who=document.createElement("select");
  who.setAttribute("aria-label","Who paid in");
  PEOPLE.forEach(function(x){
    var o=document.createElement("option"); o.value=x; o.textContent=x; who.appendChild(o);
  });
  var d=quickDraft[p.id]||{};
  amt.value=d.amount||""; note.value=d.note||""; who.value=d.who||PEOPLE[0];
  function keep(){ quickDraft[p.id]={amount:amt.value,note:note.value,who:who.value}; }
  amt.oninput=keep; note.oninput=keep; who.onchange=keep;
  function add(){
    var a=num(amt.value);
    if(!a){ amt.focus(); return; }
    delete quickDraft[p.id];
    save({id:uid(),kind:"move",potId:p.id,date:ymd(new Date()),amount:a,
          who:who.value,note:note.value.trim(),createdAt:nowIso(),schema:SCHEMA});
  }
  amt.onkeydown=note.onkeydown=function(e){ if(e.key==="Enter") add(); };
  var go=el("button","btn btn-sm","Add money");
  go.onclick=add;
  q.appendChild(amt); q.appendChild(note); q.appendChild(who); q.appendChild(go);
  q.appendChild(el("span","ptarget","A negative amount records a withdrawal"));
  card.appendChild(q);

  var ms=movesOf(p.id).slice(0,6);
  if(ms.length){
    var wrap=el("div","entries");
    ms.forEach(function(m){
      var r=el("div","entry");
      r.appendChild(el("span","edate",shortDate(m.date)));
      var w=el("span","who",m.who||PEOPLE[0]); w.dataset.w=whoSlot(m.who);
      r.appendChild(w);
      r.appendChild(el("span","enote",m.note||"—"));
      r.appendChild(el("span","eamt",money2(num(m.amount))));
      var x=el("button","rm","×");
      x.type="button"; x.title="Remove this payment";
      x.setAttribute("aria-label","Remove "+money2(num(m.amount)));
      x.onclick=function(){ remove(m.id); };
      r.appendChild(x);
      wrap.appendChild(r);
    });
    card.appendChild(wrap);
  }
  return card;
}

}

$("#newBtn").onclick=function(){ if(view.page==="month") openNewCat(); else openNewPot(); };
$("#mCancel").onclick=hideModal;
$("#scrim").onclick=function(e){ if(e.target===$("#scrim")) hideModal(); };
document.addEventListener("keydown",function(e){

});
$("#mDelete").onclick=function(){

$("#mSave").onclick=function(){
  var name=$("#fName").value.trim();
  if(!name){ $("#fName").focus(); return; }
  var amount=$("#fAmount").value===""?null:num($("#fAmount").value);
  var r;
  if(editing){
    var ex=records.find(function(x){ return x.id===editing; });
    r=ex?clone(ex):null;
  }
  if(!r){
    r={id:uid(),kind:draft.kind,createdAt:nowIso(),schema:SCHEMA,
       order:(of(draft.kind).length+1)};
  }

  r.name=name;

      r.budgets[viewKey()]=amount==null?0:amount;

    } else {
      r.budget=amount==null?0:amount;
      delete r.budgets[viewKey()];   // the standing figure takes over again
    }

    r.target=amount==null?0:amount;
  }

/* ============================ status line ============================ */
var flashTimer=null;
function flashStatus(msg){

/* ============================ storage panel ============================ */
function fmtBytes(b){
  if(b==null) return "—";
  if(b<1024) return b+" B";
  if(b<1048576) return (b/1024).toFixed(1)+" KB";
  return (b/1048576).toFixed(1)+" MB";
}
function renderStorage(){
  var chip=$("#engineChip");
  if(chip) chip.textContent = idb ? "IndexedDB · "+IDB_NAME+" v"+IDB_VER : storageInfo.engine;
  var g=$("#sgrid"); if(!g) return;

    : "Everything is written to this device's database. Connect Google Drive below, or export a copy, to carry it to another device.";
}

/* ============================ export / import ============================ */
function payload(){
  return {format:"budget-console",version:IDB_VER,exportedAt:nowIso(),
          records:records};
}
function mergePayload(p){
  if(!p||!Array.isArray(p.records)) return null;
  var byId={}; records.forEach(function(r){ byId[r.id]=r; });
  var added=0,updated=0,write=[];
  p.records.forEach(function(c){
    if(!c||!c.id) return;
    var l=byId[c.id];
    if(!l){ putRecord(c); write.push(c); added++; }
    else if((c.updatedAt||"")>(l.updatedAt||"")){ putRecord(c); write.push(c); updated++; }
  });
  if(write.length){
    if(idb) idbPutMany("records",write).catch(function(){});
    write.forEach(pushOne);
    refreshView(); render();
  }
  return {added:added,updated:updated};
}
function doExport(){
  var text=JSON.stringify(payload(),null,2);
  var name="budget-console-"+ymd(new Date())+".json";
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(d){
      if(!d) throw new Error("no downloads");
      return d.save({filename:name,data:text});
    }).then(function(){ flashStatus("Exported "+name+"."); })
      .catch(function(){ clipboardFallback(text); });
    return;
  }
  try{
    var blob=new Blob([text],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    flashStatus("Exported "+name+".");
  }catch(e){ clipboardFallback(text); }
}
function clipboardFallback(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(function(){ flashStatus("Download unavailable here — the full export is on your clipboard."); })
      .catch(function(){ flashStatus("Export unavailable in this view."); });
  } else flashStatus("Export unavailable in this view.");
}
$("#exportBtn").onclick=doExport;
$("#exportBtn2").onclick=doExport;
$("#importBtn").onclick=function(){ $("#importFile").click(); };
$("#importFile").onchange=function(){
  var f=this.files&&this.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    var p; try{ p=JSON.parse(String(fr.result)); }
    catch(e){ flashStatus("That file is not valid JSON."); return; }
    var r=mergePayload(p);
    flashStatus(r?("Imported — "+r.added+" new, "+r.updated+" updated."):"No records in that file.");
  };
  fr.readAsText(f);
  this.value="";
};
$("#wipeBtn").onclick=function(){
  if(!idb){ flashStatus("No local database to wipe."); return; }
  var live=rows.length;
  var go=window.confirm("Delete all "+live+" records from this device? "+
    (persistMode==="db"&&cloudSync
      ? "They are mirrored to your account, so they will come back on the next sync unless you turn sync off first."
      : "This cannot be undone."));
  if(!go) return;
  idbClear("records").then(function(){
    records=[]; refreshView(); render();
    flashStatus("Local database wiped.");
  }).catch(function(e){ flashStatus("Wipe failed ("+((e&&e.message)||"error")+")."); });
};
$("#syncToggle").onchange=function(){ setCloudSync(this.checked); };
$("#syncNowBtn").onclick=function(){
  if(persistMode!=="db"||!db) return;
  records.forEach(pushOne);
  flashStatus("Sync run — "+records.length+" records checked against your account.");
};

/* bridge for the standalone build: Drive sync and the local database file */
window.__bc={
  data:function(){ return payload(); },
  load:function(p){ var r=mergePayload(p); return r?{added:r.added,updated:r.updated,vision:0}:null; },
  status:function(m){ flashStatus(m); },
  onChange:null
};
function afterWrite(){
  if(window.__bc&&typeof window.__bc.onChange==="function"){
    try{ window.__bc.onChange(); }catch(e){}
  }
}

/* ============================ cloud ============================ */
function subscribe(){
  if(!db||unsub) return;
  unsub=db.collection("records").onSnapshot(applySnapshot,function(e){
    flashStatus("Sync error ("+((e&&e.code)||"unknown")+"). Your figures are safe in the local database.");
  });
}
function connectCloud(){
  if(!(window.claude&&window.claude.use)){ persistMode=idb?"local":"none"; renderStorage(); return Promise.resolve(false); }
  return window.claude.use("db").then(function(d){
    if(!d){ persistMode=idb?"local":"none"; renderStorage(); return false; }
    db=d; persistMode="db";
    if(cloudSync){ subscribe(); records.forEach(pushOne); }
    setSaveState(); renderStorage();
    return true;
  }).catch(function(){
    persistMode=idb?"local":"none"; renderStorage(); return false;
  });
}
/* The seed marker lives with the account, not the device, so clearing the
   examples on one machine does not bring them back on the next. */
function seedIfNeeded(haveCloud){
  if(records.length) return Promise.resolve();
  var mark=function(){
    if(!(haveCloud&&db)) return Promise.resolve();
    return db.collection("meta").doc("app").set({seeded:true,seededAt:nowIso()}).catch(function(){});
  };
  var check=(haveCloud&&db)
    ? db.collection("meta").doc("app").get().then(function(d){ return !!(d&&d.data&&d.data()&&d.data().seeded); })
        .catch(function(){ return false; })
    : Promise.resolve(false);
  return check.then(function(already){
    if(already) return;
    var seeds=sampleRows();
    seeds.forEach(putRecord);
    refreshView(); render();
    if(idb) idbPutMany("records",seeds).catch(function(){});
    seeds.forEach(pushOne);
    return mark();
  });
}

/* ============================ boot ============================ */
(function setToday(){
  var d=new Date();
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var W=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  $("#todayTag").textContent=W[d.getDay()]+" "+d.getDate()+" "+M[d.getMonth()]+" "+d.getFullYear();
})();

rows=sampleRows();   // provisional, so the first paint is never blank
render();

window.addEventListener("online",function(){
  if(persistMode==="db"&&db&&cloudSync) records.forEach(pushOne);
});

(function boot(){
  idbOpen().then(function(d){
    idb=d; storageInfo.engine="IndexedDB";
    return idbAll("records");
  }).then(function(rs){
    records=rs||[];
    return idbGet("meta","sync");
  }).then(function(m){
    if(m&&typeof m.v==="boolean") cloudSync=m.v;
    purgeTombstones();
    booting=false;
    refreshView(); render(); setSaveState();
    requestPersistence();
    return connectCloud();
  }).then(function(haveCloud){
    return seedIfNeeded(haveCloud);
  }).catch(function(e){
    idb=null; booting=false;
    storageInfo.engine="unavailable";
    if(!records.length) records=sampleRows();
    refreshView(); render();
    setSaveState("error","No local database");
    flashStatus("Local database unavailable ("+((e&&e.message)||"error")+
      "). Your figures still sync to your account if it is reachable.");
    connectCloud().then(function(hc){ return seedIfNeeded(hc); });
  });
})();

})();
</script>


<script>
/* ============================================================
   Standalone layer — runs only outside the Claude host.

   Two optional backends sit on top of the IndexedDB working store:
     · Google Drive  — one JSON file in your Drive, synced across every
                       device that opens this page. Needs the page served
                       over http(s) and your own OAuth client id.
     · Database file — a file on this machine the app writes to directly,
                       via the File System Access API.
   Neither is required. With both off the app is still fully usable, it
   just keeps its data to this browser.
   ============================================================ */
(function(){
  if (window.claude) return;

  var SERVED = location.protocol === "http:" || location.protocol === "https:";
  var FS_OK  = typeof window.showSaveFilePicker === "function";
  var SCOPE  = "https://www.googleapis.com/auth/drive.file";
  var FILENAME = "budget-console.json";
  var IDB_NAME = "budget_console";
  var APP = window.__bc;
  var LABEL = "Budget Console";

  var handle = null, fsTimer = null;
  var clientId = null, token = null, tokenExp = 0, fileId = null;
  var driveTimer = null, syncing = false, lastSync = 0, autoDrive = false;

  function byId(x){ return document.getElementById(x); }
  function hhmm(){ var d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

  /* ---------- a tiny meta store, sharing the app's own database ---------- */
  function openDb(){
    return new Promise(function(res,rej){
      var r = indexedDB.open(IDB_NAME);
      r.onsuccess=function(){ res(r.result); };
      r.onerror=function(){ rej(r.error); };
    });
  }
  function metaPut(k,v){
    return openDb().then(function(d){
      return new Promise(function(res,rej){
        var tx; try{ tx=d.transaction("meta","readwrite"); }catch(e){ d.close(); return rej(e); }
        tx.objectStore("meta").put({k:k,v:v});
        tx.oncomplete=function(){ d.close(); res(); };
        tx.onerror=function(){ d.close(); rej(tx.error); };
      });
    });
  }
  function metaGet(k){
    return openDb().then(function(d){
      return new Promise(function(res,rej){
        var tx,rq;
        try{ tx=d.transaction("meta","readonly"); rq=tx.objectStore("meta").get(k); }
        catch(e){ d.close(); return rej(e); }
        tx.oncomplete=function(){ d.close(); res(rq.result && rq.result.v); };
        tx.onerror=function(){ d.close(); rej(tx.error); };
      });
    });
  }

  /* ======================= Google Drive ======================= */
  function driveState(t){ var e=byId("gdState"); if(e) e.textContent=t; }
  function driveBusy(b){
    ["gdConnect","gdSync","gdOff"].forEach(function(id){ var e=byId(id); if(e) e.disabled=b; });
  }
  function showDriveButtons(){
    var connected = !!clientId && !!token;
    var c=byId("gdConnect"), s=byId("gdSync"), o=byId("gdOff");
    if(c) c.hidden = connected;
    if(s) s.hidden = !connected;
    if(o) o.hidden = !connected;
  }

  function loadGis(){
    return new Promise(function(res,rej){
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      var s=document.createElement("script");
      s.src="https://accounts.google.com/gsi/client"; s.async=true; s.defer=true;
      s.onload=function(){ res(); };
      s.onerror=function(){ rej(new Error("could not reach Google sign-in")); };
      document.head.appendChild(s);
    });
  }

  function ensureToken(interactive){
    if (token && Date.now() < tokenExp - 60000) return Promise.resolve(token);
    if (!clientId) return Promise.reject(new Error("no client id set"));
    return loadGis().then(function(){
      return new Promise(function(res,rej){
        var tc = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: SCOPE,
          callback: function(r){
            if (r && r.access_token){
              token = r.access_token;
              tokenExp = Date.now() + ((r.expires_in || 3600) * 1000);
              res(token);
            } else rej(new Error((r && r.error) || "sign-in failed"));
          },
          error_callback: function(e){ rej(new Error((e && (e.type || e.message)) || "sign-in cancelled")); }
        });
        try { tc.requestAccessToken({ prompt: interactive ? "" : "none" }); }
        catch(e){ rej(e); }
      });
    });
  }

  function dFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: "Bearer " + token }, opts.headers || {});
    return fetch(url, opts).then(function(r){
      if (r.status === 401 || r.status === 403){
        token = null;
        return r.text().then(function(){ throw new Error("access denied (" + r.status + ")"); });
      }
      if (!r.ok) return r.text().then(function(t){ throw new Error("Drive " + r.status + " " + t.slice(0,120)); });
      return r;
    });
  }

  function findFile(){
    var q = encodeURIComponent("name='" + FILENAME + "' and trashed=false");
    return dFetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=files(id,name,modifiedTime)&spaces=drive")
      .then(function(r){ return r.json(); })
      .then(function(j){ return (j.files && j.files[0]) || null; });
  }
  function createFile(text){
    var meta = { name: FILENAME, mimeType: "application/json", description: "Budget Console database — categories, monthly spending and savings pots." };
    var b = "bd" + Date.now();
    var body = "--" + b + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) +
               "\r\n--" + b + "\r\nContent-Type: application/json\r\n\r\n" + text + "\r\n--" + b + "--";
    return dFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method: "POST",
      headers: { "Content-Type": "multipart/related; boundary=" + b },
      body: body
    }).then(function(r){ return r.json(); }).then(function(j){ fileId = j.id; return j.id; });
  }
  function readFile(id){
    return dFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media")
      .then(function(r){ return r.text(); })
      .then(function(t){ try { return JSON.parse(t); } catch(e){ return null; } });
  }
  function writeFileTo(id, text){
    return dFetch("https://www.googleapis.com/upload/drive/v3/files/" + id + "?uploadType=media", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: text
    });
  }

  /* Download, merge into the local database, upload the merged result.
     Records resolve newest-wins, so two devices converge without a server. */
  function syncDrive(interactive){
    if (!clientId){ driveState("no client id — paste one and connect"); return Promise.resolve(); }
    if (syncing) return Promise.resolve();
    syncing = true; driveBusy(true); driveState("syncing…");
    return ensureToken(interactive)
      .then(function(){ return fileId ? { id: fileId } : findFile(); })
      .then(function(f){ if (f){ fileId = f.id; return readFile(f.id); } return null; })
      .then(function(remote){
        var pulled = 0;
        if (remote && APP){
          var r = APP.load(remote);
          if (r) pulled = (r.added||0) + (r.updated||0) + (r.vision||0);
        }
        var text = JSON.stringify(APP.data(), null, 2);
        return (fileId ? writeFileTo(fileId, text) : createFile(text)).then(function(){ return pulled; });
      })
      .then(function(pulled){
        lastSync = Date.now();
        autoDrive = true;
        driveState("synced " + hhmm() + (pulled ? " · pulled " + pulled + " records" : ""));
        metaPut("driveFileId", fileId).catch(function(){});
        showDriveButtons();
      })
      .catch(function(e){
        var m = (e && e.message) || "error";
        if (m.indexOf("none") > -1 || m.indexOf("cancel") > -1) driveState("not connected");
        else driveState("error — " + m);
        showDriveButtons();
      })
      .then(function(){ syncing = false; driveBusy(false); });
  }
  function scheduleDrive(){
    if (!autoDrive || !clientId) return;
    clearTimeout(driveTimer);
    driveTimer = setTimeout(function(){ syncDrive(false); }, 2500);
  }

  /* ======================= local database file ======================= */
  function fsState(t){ var e=byId("fsState"); if(e) e.textContent=t; }
  function fsReconnect(v){ var b=byId("fsRe"); if(b) b.hidden = !v; }
  function writeLocalFile(){
    if (!handle || !APP) return Promise.resolve();
    var text = JSON.stringify(APP.data(), null, 2);
    return handle.createWritable()
      .then(function(w){ return w.write(text).then(function(){ return w.close(); }); })
      .then(function(){ fsState(handle.name + " · saved " + hhmm()); })
      .catch(function(e){ fsState("write failed (" + ((e && e.name) || "error") + ")"); fsReconnect(true); });
  }
  function scheduleFs(){ if(!handle) return; clearTimeout(fsTimer); fsTimer = setTimeout(writeLocalFile, 700); }
  function bindFs(h, loud){
    handle = h; fsReconnect(false);
    metaPut("fileHandle", h).catch(function(){});
    fsState(h.name + " · bound");
    if (loud && APP) APP.status("Bound to " + h.name + " — every change now writes to that file.");
    scheduleFs();
  }

  /* ======================= UI ======================= */
  function row(){
    var r = document.createElement("div");
    r.className = "sactions";
    r.style.borderTop = "1px solid var(--line)";
    return r;
  }
  function label(t){
    var s = document.createElement("span");
    s.textContent = t;
    s.style.cssText = "font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)";
    return s;
  }
  function stat(id, t){
    var s = document.createElement("span");
    s.id = id; s.textContent = t;
    s.style.cssText = "font-family:var(--mono);font-size:12px;color:var(--muted)";
    return s;
  }
  function spacer(){ var s=document.createElement("span"); s.style.flex="1 1 20px"; return s; }
  function btn(id, text, fn, hidden){
    var b = document.createElement("button");
    b.className = "btn btn-sm"; b.id = id; b.textContent = text; b.onclick = fn;
    if (hidden) b.hidden = true;
    return b;
  }

  /* The two consoles are one site when hosted, so each links to the other.
     This lives in the standalone layer because the hosted artifacts have
     separate URLs and no such sibling. */
  function crossLink(){
    if (document.getElementById("siteLink")) return;
    /* after the page tabs where a console has them, otherwise beside the title */
    var nav = document.getElementById("pagenav") || document.querySelector(".brand");
    if (!nav) return;
    var a = document.createElement("a");
    a.id = "siteLink"; a.href = "../"; a.textContent = "\u2190 Dashboard";
    a.style.cssText = "margin-left:9px;align-self:center;font-size:13px;font-weight:500;"
      + "color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:1px solid transparent";
    a.onmouseenter = function(){ a.style.color = "var(--ink)"; a.style.borderBottomColor = "var(--line-2)"; };
    a.onmouseleave = function(){ a.style.color = "var(--muted)"; a.style.borderBottomColor = "transparent"; };
    nav.parentNode.insertBefore(a, nav.nextSibling);
  }

  function mount(){
    crossLink();
    var anchor = document.querySelector(".sactions");
    if (!anchor) return setTimeout(mount, 120);

    var t = byId("syncToggle"); if (t && t.closest){ var lab = t.closest("label"); if (lab) lab.hidden = true; }
    var sn = byId("syncNowBtn"); if (sn) sn.hidden = true;

    /* --- Google Drive row --- */
    var gd = row();
    gd.appendChild(label("Google Drive"));
    gd.appendChild(stat("gdState", SERVED ? "not connected" : "needs the page served over http(s)"));
    gd.appendChild(spacer());

    var idInput = document.createElement("input");
    idInput.type = "text"; idInput.id = "gdClient";
    idInput.placeholder = "OAuth client ID …apps.googleusercontent.com";
    idInput.style.cssText = "flex:1 1 280px;min-width:0;font-family:var(--mono);font-size:11.5px";
    idInput.onchange = function(){
      clientId = idInput.value.trim() || null;
      metaPut("driveClientId", clientId).catch(function(){});
      driveState(clientId ? "client id saved — connect to sign in" : "not connected");
      showDriveButtons();
    };
    gd.appendChild(idInput);
    gd.appendChild(btn("gdConnect", "Connect Drive", function(){
      clientId = (idInput.value || "").trim() || clientId;
      if (!clientId){ driveState("paste your OAuth client id first"); idInput.focus(); return; }
      metaPut("driveClientId", clientId).catch(function(){});
      syncDrive(true);
    }));
    gd.appendChild(btn("gdSync", "Sync now", function(){ syncDrive(true); }, true));
    gd.appendChild(btn("gdOff", "Disconnect", function(){
      token = null; autoDrive = false; fileId = null;
      metaPut("driveFileId", null).catch(function(){});
      driveState("disconnected — local database only");
      showDriveButtons();
    }, true));

    if (!SERVED){
      idInput.disabled = true;
      var c = byId("gdConnect"); if (c) c.disabled = true;
    }

    /* --- local database file row --- */
    var fsRow = row();
    fsRow.appendChild(label("Database file"));
    fsRow.appendChild(stat("fsState", FS_OK ? "not bound — IndexedDB only" : "not supported in this browser"));
    fsRow.appendChild(spacer());
    if (FS_OK){
      fsRow.appendChild(btn("fsNew", "Choose file…", function(){
        window.showSaveFilePicker({
          suggestedName: FILENAME,
          types: [{ description: LABEL + " database", accept: { "application/json": [".json"] } }]
        }).then(function(h){ bindFs(h, true); }).catch(function(){});
      }));
      fsRow.appendChild(btn("fsOpen", "Open file…", function(){
        window.showOpenFilePicker({
          multiple: false,
          types: [{ description: LABEL + " database", accept: { "application/json": [".json"] } }]
        }).then(function(hs){
          var h = hs[0];
          return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
            var p; try { p = JSON.parse(txt); } catch(e){ APP.status("That file is not valid JSON."); return; }
            var r = APP.load(p);
            APP.status(r ? ("Loaded " + h.name + " — " + r.added + " new, " + r.updated + " updated.") : "No records in that file.");
            bindFs(h, false);
          });
        }).catch(function(){});
      }));
      fsRow.appendChild(btn("fsRe", "Reconnect", function(){
        metaGet("fileHandle").then(function(h){
          if (!h || !h.requestPermission) return;
          h.requestPermission({ mode: "readwrite" }).then(function(p){
            if (p === "granted") bindFs(h, true); else fsState("permission declined");
          }).catch(function(){});
        }).catch(function(){});
      }, true));
    }

    anchor.parentNode.insertBefore(gd, anchor.nextSibling);
    gd.parentNode.insertBefore(fsRow, gd.nextSibling);

    if (APP) APP.onChange = function(){ scheduleFs(); scheduleDrive(); };

    /* restore saved settings */
    metaGet("driveClientId").then(function(v){
      if (!v) return;
      clientId = v; idInput.value = v;
      return metaGet("driveFileId").then(function(f){
        if (f) fileId = f;
        driveState("client id saved — connect to sign in");
        if (SERVED) return syncDrive(false);   // silent resume if the grant is still live
      });
    }).catch(function(){});

    if (FS_OK){
      metaGet("fileHandle").then(function(h){
        if (!h || !h.queryPermission) return;
        h.queryPermission({ mode: "readwrite" }).then(function(p){
          if (p === "granted"){ handle = h; fsState(h.name + " · bound"); }
          else { fsState("a file was bound last time — Reconnect to resume"); fsReconnect(true); }
        }).catch(function(){});
      }).catch(function(){});
    }

    showDriveButtons();

    /* pick up other devices when you come back to the tab */
    document.addEventListener("visibilitychange", function(){
      if (!document.hidden && autoDrive && Date.now() - lastSync > 20000) syncDrive(false);
    });
    window.addEventListener("online", function(){ if (autoDrive) syncDrive(false); });
    window.addEventListener("beforeunload", function(){ if (handle) writeLocalFile(); });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
  else mount();
})();
</script>

</body>
</html>
