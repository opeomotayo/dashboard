<style>:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
.themebtn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.themebtn .ti{font-size:15px;line-height:1}

  color:var(--ink-2,#2D3650);padding:8px 13px;border-radius:9px;font:500 13px var(--body,system-ui);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08)}

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Property Console — a rental portfolio month by month: income, expenses, cashflow, return on cash and gross yield per property. Local-first, with optional Google Drive sync.">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  body{font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fafaf9}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Property Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ── Property Console ──────────────────────────────────────────────────
   One month of a rental portfolio: what came in, what went out, what is
   left, and what that is as a return on the cash tied up in each place.
   Same type and tokens as the Goal and Budget consoles.
   Colour: surplus and deficit use indigo against red — a blue/warm pair,
   not green/red, because green against red collapses under deuteranopia
   (validated: light dE 21.8, dark 16.9). Position against the zero line
   carries the sign as well, so colour is never doing the work alone.
   The expense breakdown is one hue with the category named beside each
   bar, which needs no categorical palette at all.
   ──────────────────────────────────────────────────────────────────── */
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --sunken:#F4F6FA; --raised:#FFFFFF;
  --ink:#0B1020; --ink-2:#2D3650; --muted:#5C6880; --faint:#8E99AE;
  --line:#DFE4EE; --line-2:#C7D0E0;

  --accent:#3A4FC4; --accent-ink:#3A4FC4; --accent-soft:#E7EAFB; --on-accent:#FFFFFF;

  --hold:#0F7A55;  --hold-ink:#0F7A55;  --hold-soft:#E2F2EC;
  --slip:#B07D00;  --slip-ink:#8A6300;  --slip-soft:#F8EFD9;
  --stall:#C0203F; --stall-ink:#C0203F; --stall-soft:#FBE6EA;
  --off:#7A869E;   --off-ink:#5C6880;   --off-soft:#EDF0F5;

  /* surplus / deficit — a blue-warm diverging pair, CVD-safe */
  --up:#3A4FC4; --up-soft:#E7EAFB;
  --down:#C0203F; --down-soft:#FBE6EA;

  --shadow-1:0 1px 1px rgba(11,16,32,.04), 0 2px 6px -2px rgba(11,16,32,.08);
  --shadow-2:0 2px 4px rgba(11,16,32,.05), 0 14px 28px -16px rgba(11,16,32,.22);
  --r-lg:16px; --r-md:11px; --r-sm:7px;

  --display:"Bricolage Grotesque","Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#080B14; --surface:#121826; --sunken:#0D1220; --raised:#192030;
    --ink:#E9EDF7; --ink-2:#C3CBDD; --muted:#8E99B2; --faint:#68738C;
    --line:#212A3D; --line-2:#2E3850;
    --accent:#6478DE; --accent-ink:#9AA8F6; --accent-soft:#1A2142; --on-accent:#070A14;
    --hold:#0FA37E;  --hold-ink:#45D3A8;  --hold-soft:#0E2A24;
    --slip:#BE7A1E;  --slip-ink:#E0A94B;  --slip-soft:#2B2113;
    --stall:#DC4A72; --stall-ink:#F2819C; --stall-soft:#2E1620;
    --off:#5C6882;   --off-ink:#8E99B2;   --off-soft:#171E2D;
    --up:#6478DE; --up-soft:#1A2142;
    --down:#DC4A72; --down-soft:#2E1620;
    --shadow-1:0 1px 1px rgba(0,0,0,.5), 0 2px 8px -2px rgba(0,0,0,.6);
    --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 18px 34px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#080B14; --surface:#121826; --sunken:#0D1220; --raised:#192030;
  --ink:#E9EDF7; --ink-2:#C3CBDD; --muted:#8E99B2; --faint:#68738C;
  --line:#212A3D; --line-2:#2E3850;
  --accent:#6478DE; --accent-ink:#9AA8F6; --accent-soft:#1A2142; --on-accent:#070A14;
  --hold:#0FA37E;  --hold-ink:#45D3A8;  --hold-soft:#0E2A24;
  --slip:#BE7A1E;  --slip-ink:#E0A94B;  --slip-soft:#2B2113;
  --stall:#DC4A72; --stall-ink:#F2819C; --stall-soft:#2E1620;
  --off:#5C6882;   --off-ink:#8E99B2;   --off-soft:#171E2D;
  --up:#6478DE; --up-soft:#1A2142;
  --down:#DC4A72; --down-soft:#2E1620;
  --shadow-1:0 1px 1px rgba(0,0,0,.5), 0 2px 8px -2px rgba(0,0,0,.6);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 18px 34px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;
  line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.lbl,.thead h3,.field label,.scell .k{font-family:var(--mono);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint)}

/* ── shell ─────────────────────────────────────────────────────────── */
.shell{max-width:1100px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 76px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:13px}
.brand{display:flex;align-items:baseline;gap:11px;margin-right:auto;min-width:0}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
.brand .tag{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}

.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;
  transition:background .14s,border-color .14s,color .14s,transform .08s}
.btn:hover{background:var(--sunken);color:var(--ink);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 9px}
.btn-ghost:hover{background:var(--sunken);color:var(--ink)}
.btn-sm{font-size:12.5px;padding:6px 11px}
.btn-wipe{color:var(--stall-ink);border-color:var(--stall)}
.btn-wipe:hover{background:var(--stall-soft)}

.savepill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);white-space:nowrap}
.savepill .sdot{width:6px;height:6px;border-radius:50%;background:var(--hold);flex:none}
.savepill[data-s="saving"]{color:var(--accent-ink);border-color:var(--accent)}
.savepill[data-s="saving"] .sdot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.savepill[data-s="error"]{color:var(--stall-ink);background:var(--stall-soft);border-color:var(--stall)}
.savepill[data-s="error"] .sdot{background:var(--stall)}
.savepill[data-s="local"]{color:var(--slip-ink);background:var(--slip-soft);border-color:var(--slip)}
.savepill[data-s="local"] .sdot{background:var(--slip)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── period picker ─────────────────────────────────────────────────── */
.periodnav{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:22px}
.navsel{display:inline-flex;align-items:center;gap:7px}
.navsellab{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}
select,input[type=text],input[type=number]{width:100%;background:var(--surface);
  border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.monsel{width:auto;min-width:92px;font-family:var(--display);font-weight:600;font-size:14.5px;
  padding:7px 10px;letter-spacing:-.01em}
.navnote{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint)}

/* ── panels and figures ────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);padding:22px 24px;margin-top:20px}
.kpis{display:flex;gap:30px;flex-wrap:wrap}
.kpi{min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .kv{font-family:var(--display);font-size:29px;font-weight:800;line-height:1;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:11.5px;color:var(--muted);line-height:1.35}
.kv[data-sign="down"]{color:var(--down)}
.kv[data-sign="up"]{color:var(--up)}

.figure{margin-top:20px}
.figure .fhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.figure h3{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.figure .fnote{font-size:11.5px;color:var(--muted)}
.figure .grow{flex:1 1 10px}
.key{display:flex;gap:15px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.key i{width:9px;height:9px;border-radius:2px;flex:none}

/* diverging bars: name, bar either side of a centre line, value */
.dbar{display:grid;grid-template-columns:minmax(96px,168px) 1fr minmax(86px,auto);
  align-items:center;gap:13px;padding:5px 0}
.dbar .dname{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtrack{position:relative;height:19px;background:var(--sunken);border-radius:5px}
.dtrack .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.dtrack i{position:absolute;top:3px;bottom:3px;border-radius:3px;display:block}
.dbar .dval{font-family:var(--mono);font-size:12.5px;text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.dbar .dval[data-sign="down"]{color:var(--down)}

/* twelve months */
.months{display:flex;align-items:flex-end;gap:6px;height:124px;margin-top:4px}
.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
  height:100%;cursor:pointer;background:none;border:0;padding:0;gap:4px}
.mcol .mplot{position:relative;width:100%;flex:1 1 auto}
.mcol .mbar{position:absolute;left:16%;right:16%;border-radius:2px}
.mcol .mzero{position:absolute;left:0;right:0;height:1px;background:var(--line-2)}
.mcol .mlab{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--faint)}
.mcol[aria-pressed="true"] .mlab{color:var(--ink);font-weight:600}
.mcol:hover .mlab{color:var(--ink-2)}

/* expense breakdown: one hue, label beside each bar */
.ebar{display:grid;grid-template-columns:minmax(92px,150px) 1fr minmax(78px,auto);
  align-items:center;gap:13px;padding:4px 0}
.ebar .ename{font-size:13.5px;color:var(--ink-2)}
.etrack{height:15px;background:var(--sunken);border-radius:4px;overflow:hidden}
.etrack i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ebar .eval{font-family:var(--mono);font-size:12.5px;text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── property cards ────────────────────────────────────────────────── */
.listhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:28px 0 10px}
.listhead h2{font-size:17px;font-weight:700}
.listhead .grow{flex:1 1 10px}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-1);padding:16px 18px;margin-bottom:11px}
.prop[data-sign="down"]{border-color:var(--down)}
.phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pname{font-family:var(--display);font-size:16.5px;font-weight:700;letter-spacing:-.02em;min-width:0}
.pflag{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;background:var(--slip-soft);color:var(--slip-ink);flex:none}
.pcash{margin-left:auto;font-family:var(--display);font-size:19px;font-weight:700;
  letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pcash[data-sign="down"]{color:var(--down)}
.pgrid{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--line)}
.pcell{min-width:0}
.pcell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}
.pcell .v{font-family:var(--mono);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.pcell .v small{font-size:11px;color:var(--muted)}
.pacts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pacts .grow{flex:1 1 10px}
.rentbox{display:inline-flex;align-items:center;gap:7px}
.rentbox input{width:104px}
.quick{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:11px;
  border-top:1px dashed var(--line);padding-top:11px}
.quick input[type=number]{width:102px}
.quick input[type=text]{flex:1 1 140px;min-width:0}
.quick select{width:auto;min-width:118px}
.entries{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.entry{display:flex;align-items:baseline;gap:10px;padding:5px 0;font-size:13.5px}
.entry .ecat{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:999px;flex:none}
.entry .enote{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .eamt{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rm{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;padding:2px 5px;flex:none}
.rm:hover{color:var(--stall-ink)}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-md);
  padding:26px 22px;text-align:center;color:var(--muted);font-size:14px}
.banner{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:18px;
  background:var(--slip-soft);border:1px solid var(--slip);border-radius:var(--r-md);
  padding:13px 16px;font-size:13.5px;color:var(--slip-ink)}
.banner .grow{flex:1 1 10px}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;
  background:var(--ink);color:var(--paper);padding:11px 17px;border-radius:999px;font-size:13.5px;
  box-shadow:var(--shadow-2);max-width:min(560px,92vw)}

.store{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);margin-top:30px;overflow:hidden}
.shead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.shead h2{font-size:15.5px;font-weight:700}
.engine{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
.sgrid{display:flex;gap:26px;flex-wrap:wrap;padding:15px 18px}
.scell .v{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.sactions{padding:15px 18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.snote{margin:0;padding:0 18px 16px;font-size:12.5px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(8,11,20,.55);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);width:min(560px,100%)}
.mhead{padding:18px 20px 0}
.mhead h2{font-size:18px;font-weight:700}
.mbody{padding:16px 20px;display:flex;flex-direction:column;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field .hint{font-size:12px;color:var(--muted)}
.row2{display:flex;gap:13px;flex-wrap:wrap}
.row2 .field{flex:1 1 150px;min-width:0}
.mfoot{display:flex;gap:9px;padding:15px 20px 18px;border-top:1px solid var(--line)}
.mfoot .btn-danger{color:var(--stall-ink);border-color:var(--stall)}
.mfoot .btn-danger:hover{background:var(--stall-soft)}

@media(max-width:620px){
  .kpis{gap:20px}
  .kpi .kv{font-size:25px}
  .dbar,.ebar{grid-template-columns:1fr minmax(76px,auto);row-gap:4px}
  .dbar .dname,.ebar .ename{grid-column:1 / -1}
  .months{height:112px}
  .pcash{margin-left:0;flex-basis:100%}
}
/* ── portfolio dashboard ───────────────────────────────────────────────
   The year across the portfolio: the cash-flow equation as headline
   tiles, a month-by-month statement with a running total, income against
   costs with the cash flow drawn over them, the cumulative position, and
   where the rent comes from. Months that have not happened yet are
   projections: shown faint and kept out of every total. Series hues are
   the validated categorical order (slots 1, 2, 5); the cash-flow line is
   ink so it never competes with a series. */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}
.shell,.topbar-in{max-width:1440px}
.pagenav{display:flex;gap:3px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px}
.pagenav button{border:0;background:transparent;padding:7px 15px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.pagenav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);font-weight:600}

.pd{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:18px}
.pcardd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:15px 17px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pcardd h3{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--ink)}
.pcardd .sub{font-size:11.5px;color:var(--muted);margin-top:-6px}
.c12{grid-column:span 12}.c9{grid-column:span 9}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}

/* the equation */
.peq{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1.1fr);align-items:stretch;gap:8px}
.peq .op{display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:700;color:var(--faint)}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:14px 16px;
  border-top:4px solid var(--c);display:flex;flex-direction:column;gap:5px;min-width:0}
.pt .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pt .v{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.025em;color:var(--ink);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .v[data-sign="down"]{color:var(--down)}
.pt .s{font-size:11.5px;color:var(--muted)}
.pt.net{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.peqnote{grid-column:1/-1;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:2px}

/* statement table */
.ptbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.ptbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
.ptbl th{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.ptbl th:first-child,.ptbl td:first-child{text-align:left}
.ptbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.ptbl td:first-child{font-family:var(--body);color:var(--ink);font-weight:500}
.ptbl tr.fut td{color:var(--faint)}
.ptbl tr.fut td:first-child{color:var(--faint);font-weight:400}
.ptbl tr.cur td{background:var(--accent-soft)}
.ptbl tr.tot td{border-top:2px solid var(--line-2);border-bottom:0;font-weight:700;color:var(--ink)}
.ptbl tr.tot td:first-child{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.ptbl td.neg{color:var(--down)}
.sig{display:inline-flex;align-items:center;gap:5px;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.sig.pos{background:var(--up-soft);color:var(--up)}
.sig.neg{background:var(--down-soft);color:var(--down)}
.sig.na{color:var(--faint);font-weight:500}
.ptbl tr[data-m]{cursor:pointer}
.ptbl tr[data-m]:hover td{background:var(--sunken)}

/* charts */
.pleg{display:flex;gap:6px 15px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.pleg span{display:inline-flex;align-items:center;gap:6px}
.pleg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.pleg i.ln{width:14px;height:3px;border-radius:2px}
.pch{position:relative;width:100%}
.pch svg{display:block;width:100%;height:auto;overflow:visible}
.pch .ax{font:10px var(--mono);fill:var(--faint)}
.pch .grid{stroke:var(--line);stroke-width:1}
.pch .zero{stroke:var(--line-2);stroke-width:1.5}
.ptip{position:fixed;z-index:200;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-2);padding:8px 10px;font-size:12px;color:var(--ink-2);min-width:150px}
.ptip b{display:block;font-family:var(--display);font-size:13px;color:var(--ink);margin-bottom:4px}
.ptip div{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptip div span{display:inline-flex;align-items:center;gap:6px}
.ptip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.ptip em{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}

/* donuts */
.pdon{display:flex;flex-direction:column;align-items:center;gap:10px}
.pdon svg{width:100%;max-width:180px;height:auto}
.pdon .c1,.pbrk .c1{font-family:var(--display);font-size:20px;font-weight:800;fill:var(--ink)}
.pdon .c2,.pbrk .c2{font:8px var(--mono);fill:var(--muted);letter-spacing:.05em}
.pbrk svg{width:100%;max-width:170px;height:auto}
.pbrk{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:16px;align-items:center}
.plist{display:grid;gap:7px;font-size:12.5px;color:var(--ink-2);min-width:0}
.plist div{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.plist i{width:10px;height:10px;border-radius:50%}
.plist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.plist small{font-family:var(--mono);color:var(--muted);min-width:34px;text-align:right}
.pmeta{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12.5px;color:var(--ink-2);width:100%}
.pmeta b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}

.etrack.estack{display:flex;gap:2px;background:var(--sunken);overflow:hidden;border-radius:4px}
.etrack.estack i{border-radius:0;flex:none;min-width:2px;cursor:default}
.etrack.estack i:first-child{border-radius:4px 0 0 4px}
.etrack.estack i:last-child{border-radius:0 4px 4px 0}
.etrack.estack i:only-child{border-radius:4px}
.figure .ebar{grid-template-columns:minmax(110px,230px) 1fr minmax(78px,auto)}
.figure .ebar .ename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebar.etot{padding-bottom:9px;margin-bottom:5px;border-bottom:1px dashed var(--line)}
.ebar.etot .ename,.ebar.etot .eval{font-weight:700;color:var(--ink)}
.ebar.etot .etrack{height:20px}
@media (max-width:1100px){
  .pd{grid-template-columns:repeat(6,minmax(0,1fr))}
  .c12,.c9,.c8,.c7{grid-column:span 6} .c6,.c5,.c4,.c3{grid-column:span 3}
  .peq{grid-template-columns:repeat(2,minmax(0,1fr))} .peq .op{display:none}
}
@media (max-width:680px){
  .pd{grid-template-columns:minmax(0,1fr)}
  .pd>*{grid-column:1/-1!important}
  .pt .v{font-size:23px}
  .pbrk{grid-template-columns:minmax(0,1fr)} .pbrk svg{max-width:160px;margin:0 auto}
  .pagenav{max-width:100%;overflow-x:auto}
}
</style>

<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>Property Console</h1>
      <span class="tag" id="todayTag"></span>
    </div>
    <div class="pagenav" id="pagenav" role="group" aria-label="Section"></div>
    <span class="savepill" id="savepill" data-s="saved">
      <span class="sdot"></span><span id="savetext">Saved</span>
    </span>
    <button class="btn btn-sm" id="exportBtn">Export</button>
    <button class="btn btn-primary" id="newBtn">New property</button>
  </div>
</div>

<div class="shell">
  <div class="periodnav" id="periodnav"></div>
  <div id="pageBody"></div>

  <section class="store">
    <div class="shead">
      <h2>Local database</h2>
      <span class="engine" id="engineChip">connecting…</span>
    </div>
    <div class="sgrid" id="sgrid"></div>
    <div class="sactions">
      <label class="switch" for="syncToggle">
        <input type="checkbox" id="syncToggle">
        <span>Sync across my devices</span>
      </label>
      <button class="btn btn-sm" id="syncNowBtn">Sync now</button>
      <span style="flex:1 1 20px"></span>
      <button class="btn btn-sm" id="importBtn">Import</button>
      <button class="btn btn-sm" id="exportBtn2">Export</button>
      <button class="btn btn-sm btn-wipe" id="wipeBtn">Wipe database</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="snote" id="snote"></p>
  </section>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead"><h2 id="mTitle">New property</h2></div>
    <div class="mbody">
      <div class="field">
        <label for="fName">Property</label>
        <input type="text" id="fName" placeholder="London · 3-bed terrace">
      </div>
      <div class="row2">
        <div class="field">
          <label for="fRent">Monthly rent</label>
          <input type="number" id="fRent" min="0" step="any" placeholder="1800">
          <span class="hint">The standing figure. A void or part month is set on the card.</span>
        </div>
        <div class="field">
          <label for="fMortgage">Mortgage a month</label>
          <input type="number" id="fMortgage" min="0" step="any" placeholder="820">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fInsurance">Insurance a month</label>
          <input type="number" id="fInsurance" min="0" step="any" placeholder="28">
        </div>
        <div class="field">
          <label for="fMgmt">Management</label>
          <input type="number" id="fMgmt" min="0" max="100" step="any" placeholder="10">
          <span class="hint">Per cent of the rent received.</span>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fValue">Current value</label>
          <input type="number" id="fValue" min="0" step="any" placeholder="420000">
          <span class="hint">Used for the gross yield.</span>
        </div>
        <div class="field">
          <label for="fCash">Cash invested</label>
          <input type="number" id="fCash" min="0" step="any" placeholder="95000">
          <span class="hint">Deposit, fees and refurbishment. Used for the return.</span>
        </div>
      </div>
      <div class="field">
        <label for="fNote">Note</label>
        <input type="text" id="fNote" placeholder="Optional">
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-danger" id="mDelete" hidden>Delete</button>
      <span style="flex:1 1 10px"></span>
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================ constants ============================ */
var MONTHS=["January","February","March","April","May","June",
            "July","August","September","October","November","December"];
var MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var LAST_YEAR=2030;
/* One-off costs. Mortgage, management and insurance are standing figures on
   the property and are added to the breakdown automatically. */
var CATEGORIES=["Maintenance","Repairs","Compliance","Letting fees","Void costs","Other"];

var CUR=new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",
        minimumFractionDigits:0,maximumFractionDigits:0});
var CUR2=new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",
        minimumFractionDigits:2,maximumFractionDigits:2});
function money(n){ var v=Math.round(n||0); return (v<0?"−":"")+CUR.format(Math.abs(v)); }
function money2(n){ var v=n||0; return (v<0?"−":"")+CUR2.format(Math.abs(v)); }
function pct1(n){ var v=Math.round(n*1000)/10; return (v<0?"\u2212":"")+Math.abs(v).toFixed(1)+"%"; }

var IDB_NAME="property_console", IDB_VER=1, idb=null;
var SEED_TS="2000-01-01T00:00:00.000Z";
var SCHEMA=1;

/* ============================ state ============================ */
var db=null, unsub=null;
var records=[], rows=[];
var cloudSync=true, lastSyncAt=null, pushedAt={}, inflight=0;
var persistMode="loading";
var storageInfo={engine:"connecting…",bytes:null,persisted:null};
var editing=null, draft={};
var quickDraft={};
var now=new Date();
var view={page:"dash", prop:"all", year:now.getFullYear(), month:now.getMonth()};

function $(s){ return document.querySelector(s); }
function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }
function uid(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function bodyOf(r){ var b={}; for(var k in r){ if(k!=="id") b[k]=r[k]; } return b; }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
function pad(n){ return (n<10?"0":"")+n; }
function monthKey(y,m){ return y+"-"+pad(m+1); }
function viewKey(){ return monthKey(view.year,view.month); }
function viewLabel(){ return MONTHS[view.month]+" "+view.year; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

/* ============================ the arithmetic ============================ */
function props(){
  return rows.filter(function(r){ return r.kind==="prop"; })
    .sort(function(a,b){ return (a.order||0)-(b.order||0) || (a.name||"").localeCompare(b.name||""); });
}
function expensesOf(propId,key){
  return rows.filter(function(r){ return r.kind==="expense" && r.propId===propId && r.month===key; })
    .sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
}
/* rent actually received in a given month: the override if one is set for
   that month, otherwise the standing rent */
function rentIn(p,key){
  var o=p.rents&&p.rents[key];
  return typeof o==="number"?o:num(p.rent);
}
function isOverridden(p,key){ return !!(p.rents && typeof p.rents[key]==="number"); }

/* Everything for one property in one month. The standing costs recur on
   their own; one-off costs are whatever has been logged against the month. */
function figuresFor(p,key){
  var income=rentIn(p,key);
  var mortgage=num(p.mortgage), insurance=num(p.insurance);
  var mgmt=income*num(p.mgmtPct)/100;
  var oneOff=expensesOf(p.id,key).reduce(function(s,e){ return s+num(e.amount); },0);
  var expenses=mortgage+insurance+mgmt+oneOff;
  var cashflow=income-expenses;
  var cash=num(p.cashInvested), value=num(p.value);
  return {
    income:income, mortgage:mortgage, insurance:insurance, mgmt:mgmt,
    oneOff:oneOff, expenses:expenses, cashflow:cashflow,
    /* annualised from this one month, so a repair month reads honestly low */
    coc: cash>0 ? (cashflow*12)/cash : null,
    yield: value>0 ? (num(p.rent)*12)/value : null,
    void: income===0
  };
}
function totalsFor(key){
  var t={income:0,expenses:0,cashflow:0,mortgage:0,insurance:0,mgmt:0,oneOff:0,
         cash:0,value:0,count:0,voids:0};
  props().forEach(function(p){
    var f=figuresFor(p,key);
    t.income+=f.income; t.expenses+=f.expenses; t.cashflow+=f.cashflow;
    t.mortgage+=f.mortgage; t.insurance+=f.insurance; t.mgmt+=f.mgmt; t.oneOff+=f.oneOff;
    t.cash+=num(p.cashInvested); t.value+=num(p.value);
    t.count++; if(f.void) t.voids++;
  });
  t.coc = t.cash>0 ? (t.cashflow*12)/t.cash : null;
  t.yield = t.value>0 ? (props().reduce(function(s,p){ return s+num(p.rent)*12; },0))/t.value : null;
  return t;
}
/* the month's one-off costs grouped by category, standing costs included
   as their own rows so the breakdown adds up to the month's expenses */
function breakdownFor(key){
  var t=totalsFor(key), out=[];
  if(t.mortgage>0) out.push({name:"Mortgage",amount:t.mortgage});
  if(t.mgmt>0) out.push({name:"Management",amount:t.mgmt});
  if(t.insurance>0) out.push({name:"Insurance",amount:t.insurance});
  var byCat={};
  props().forEach(function(p){
    expensesOf(p.id,key).forEach(function(e){
      var c=CATEGORIES.indexOf(e.category)>=0?e.category:"Other";
      byCat[c]=(byCat[c]||0)+num(e.amount);
    });
  });
  CATEGORIES.forEach(function(c){ if(byCat[c]>0) out.push({name:c,amount:byCat[c]}); });
  return out.sort(function(a,b){ return b.amount-a.amount; });
}
function yearSeries(y){
  var out=[];
  for(var m=0;m<12;m++){
    var t=totalsFor(monthKey(y,m));
    out.push({month:m,income:t.income,expenses:t.expenses,cashflow:t.cashflow});
  }
  return out;
}

/* ============================ samples ============================ */
function sampleRows(){
  var k=monthKey(now.getFullYear(),now.getMonth());
  function base(o){ o.sample=true; o.deleted=false; o.schema=SCHEMA;
                    o.createdAt=nowIso(); o.updatedAt=SEED_TS; return o; }
  function prop(id,name,rent,mortgage,insurance,mgmtPct,value,cash,order,note){
    return base({id:id,kind:"prop",name:name,rent:rent,mortgage:mortgage,insurance:insurance,
                 mgmtPct:mgmtPct,value:value,cashInvested:cash,order:order,note:note||"",rents:{}});
  }
  function exp(id,propId,amount,category,note,day){
    return base({id:id,kind:"expense",propId:propId,month:k,
                 date:k+"-"+pad(Math.min(day,28)),amount:amount,category:category,note:note});
  }
  return [
    prop("pr-1","London · 3-bed, house one",   1950, 905, 31, 10, 440000, 104000, 1, ""),
    prop("pr-2","London · 3-bed, house two",   1875, 870, 29, 10, 425000,  99000, 2, ""),
    prop("pr-3","London · 3-bed, house three", 2050, 960, 33, 10, 465000, 112000, 3, ""),
    prop("pr-4","Hartlepool · 3-bed",           675, 240, 24, 12, 110000,  31000, 4, ""),

    exp("ex-1","pr-1",240,"Repairs","Boiler service and a new thermostat",6),
    exp("ex-2","pr-2",85,"Compliance","Gas safety certificate",11),
    exp("ex-3","pr-3",410,"Maintenance","Repaint hallway and stairs",9),
    exp("ex-4","pr-4",160,"Repairs","Gutter clearance and downpipe",14),
    exp("ex-5","pr-1",95,"Other","Ground rent",2)
  ];
}

/* ====================== IndexedDB ====================== */
function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB) return rej(new Error("IndexedDB unavailable"));
    var req; try{ req=indexedDB.open(IDB_NAME,IDB_VER); }catch(e){ return rej(e); }
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains("records")){
        var s=d.createObjectStore("records",{keyPath:"id"});
        s.createIndex("kind","kind",{unique:false});
        s.createIndex("updatedAt","updatedAt",{unique:false});
      }
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"k"});
    };
    req.onsuccess=function(){ res(req.result); };
    req.onerror=function(){ rej(req.error||new Error("open failed")); };
    req.onblocked=function(){ rej(new Error("another tab is upgrading the database")); };
  });
}
function idbTx(store,mode,fn){
  return new Promise(function(res,rej){
    if(!idb) return rej(new Error("no local database"));
    var tx,os,r;
    try{ tx=idb.transaction(store,mode); os=tx.objectStore(store); r=fn(os); }catch(e){ return rej(e); }
    tx.oncomplete=function(){ res(r&&"result" in r?r.result:undefined); };
    tx.onerror=function(){ rej(tx.error||new Error("transaction failed")); };
    tx.onabort=function(){ rej(tx.error||new Error("transaction aborted")); };
  });
}
function idbPut(s,v){ return idbTx(s,"readwrite",function(os){ return os.put(v); }); }
function idbGet(s,k){ return idbTx(s,"readonly",function(os){ return os.get(k); }); }
function idbAll(s){ return idbTx(s,"readonly",function(os){ return os.getAll(); }); }
function idbPutMany(s,vs){ return idbTx(s,"readwrite",function(os){ vs.forEach(function(v){os.put(v);}); return null; }); }
function idbDelMany(s,ks){ return idbTx(s,"readwrite",function(os){ ks.forEach(function(k){os.delete(k);}); return null; }); }
function idbClear(s){ return idbTx(s,"readwrite",function(os){ return os.clear(); }); }

/* ============================ writes ============================ */
function refreshView(){ rows=records.filter(function(r){ return !r.deleted; }); }
function putRecord(r){
  var i=records.findIndex(function(x){ return x.id===r.id; });
  if(i<0) records.push(r); else records[i]=r;
}
function setSaveState(s,detail){
  var pill=$("#savepill"), txt=$("#savetext");
  if(!pill) return;
  if(s==="saving"){ pill.dataset.s="saving"; txt.textContent="Saving…"; return; }
  if(s==="error"){ pill.dataset.s="error"; txt.textContent=(detail||"Not saved"); return; }
  if(!idb){ pill.dataset.s="error"; txt.textContent="No local database"; return; }
  if(persistMode==="db"&&cloudSync){ pill.dataset.s="saved"; txt.textContent="Saved · synced"; }
  else { pill.dataset.s="local"; txt.textContent="Saved locally"; }
}
function writeRecord(r){
  r.updatedAt=nowIso();
  putRecord(r); refreshView(); render();
  if(!idb){ setSaveState("error","No local database"); return Promise.resolve(); }
  inflight++; setSaveState("saving");
  return idbPut("records",r).then(function(){
    if(--inflight<=0){ inflight=0; setSaveState(); }
    pushOne(r); afterWrite();
  }).catch(function(e){
    inflight=Math.max(0,inflight-1);
    setSaveState("error","Local write failed · "+((e&&(e.name||e.message))||"error"));
  });
}
function save(r){ r.deleted=false; delete r.sample; return writeRecord(r); }
function remove(id){

/* a property's costs go with it, or they linger as expenses with no home */

/* ====================== mirror to the artifact store ====================== */
function pushOne(r){
  if(!(persistMode==="db"&&db&&cloudSync)) return;
  if(pushedAt[r.id]===r.updatedAt) return;
  pushedAt[r.id]=r.updatedAt;
  db.collection("records").doc(r.id).set(bodyOf(r)).then(function(){
    lastSyncAt=nowIso(); renderStorage();
  }).catch(function(e){
    delete pushedAt[r.id];
    setSaveState("error","Saved locally · sync "+((e&&e.code)||"failed"));
  });
}
function applySnapshot(snap){
  if(!cloudSync) return;
  var wasEmpty=records.length===0;
  var cloud=snap.docs.map(function(d){ var o=d.data()||{}; o.id=d.id; return o; });
  var byId={}; records.forEach(function(r){ byId[r.id]=r; });
  var toLocal=[], toCloud=[];
  cloud.forEach(function(c){
    var l=byId[c.id];
    if(!l || (c.updatedAt||"")>(l.updatedAt||"")) toLocal.push(c);
    else if((l.updatedAt||"")>(c.updatedAt||"")) toCloud.push(l);
    else pushedAt[c.id]=c.updatedAt;
    delete byId[c.id];
  });
  Object.keys(byId).forEach(function(id){ toCloud.push(byId[id]); });
  if(toLocal.length){
    toLocal.forEach(function(c){ putRecord(c); pushedAt[c.id]=c.updatedAt; });
    if(idb) idbPutMany("records",toLocal).catch(function(){});
    refreshView(); render();
    if(wasEmpty){
      var live=toLocal.filter(function(r){ return !r.deleted; }).length;
      if(live) flashStatus("Restored "+live+" records from your account into this device's local database.");
    }
  }
  toCloud.forEach(pushOne);
  lastSyncAt=nowIso(); renderStorage();
}
function purgeTombstones(){
  var cut=new Date(Date.now()-30*86400000).toISOString();
  var old=records.filter(function(r){ return r.deleted && (r.updatedAt||"")<cut; });
  if(!old.length) return;
  var ids=old.map(function(r){ return r.id; });
  records=records.filter(function(r){ return ids.indexOf(r.id)<0; });
  if(idb) idbDelMany("records",ids).catch(function(){});
}
function requestPersistence(){
  if(!navigator.storage) return;
  if(navigator.storage.persisted){
    navigator.storage.persisted().then(function(p){
      storageInfo.persisted=p;
      if(!p&&navigator.storage.persist) return navigator.storage.persist().then(function(g){ storageInfo.persisted=g; });
    }).then(renderStorage).catch(function(){});
  }
  if(navigator.storage.estimate){
    navigator.storage.estimate().then(function(e){ storageInfo.bytes=e.usage||0; renderStorage(); }).catch(function(){});
  }
}
function setCloudSync(on){
  cloudSync=on;
  if(idb) idbPut("meta",{k:"sync",v:on}).catch(function(){});
  if(on&&db){ subscribe(); records.forEach(pushOne); }
  else if(!on&&unsub){ unsub(); unsub=null; }
  render();
}

function donut(segs,c1,c2,label){

    var a=svgEl("circle",{cx:60,cy:60,r:R,fill:"none",stroke:sg.c,"stroke-width":Tk,"stroke-dasharray":Math.max(0,len-gap)+" "+C,"stroke-dashoffset":-off,transform:"rotate(-90 60 60)"},svg);

/* per month: income, costs (operating + mortgage stacked in one bar) and
   net cash flow, all bars on one £ axis; a loss-making month's cash-flow
   bar hangs below zero */
var C_INC="var(--s1)", C_OPX="var(--s8)", C_MTG="var(--s2)", C_NET="var(--s3)";
function flowChartCard(ys){
  var c=pcard("c7","Income, costs & cash flow");
  var leg=el("div","pleg");
  [[C_INC,"Rental income"],[C_OPX,"Operating costs"],[C_MTG,"Mortgage"],[C_NET,"Net cash flow"]].forEach(function(l){ var s=el("span"), i=el("i"); i.style.background=l[0]; s.appendChild(i); s.appendChild(document.createTextNode(l[1])); leg.appendChild(s); });
  c.appendChild(leg);
  var W=560,H=220,L=50,R=8,Tp=10,B=24;
  var vals=[]; ys.forEach(function(x){ vals.push(x.income,x.opex+x.mortgage,x.net); });
  var mx=Math.max(0,Math.max.apply(null,vals)), mn=Math.min(0,Math.min.apply(null,vals));
  var step=niceStep((mx-mn)/4||1), top=Math.ceil(mx/step)*step||step, bot=Math.floor(mn/step)*step;
  function Y(v){ return Tp+(H-Tp-B)*(top-v)/(top-bot); }
  var bw=(W-L-R)/12; function X(i){ return L+bw*(i+.5); }
  var box=el("div","pch"), svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"Rental income, operating costs, mortgage and net cash flow by month in "+view.year});
  for(var v=bot;v<=top+1e-9;v+=step){ svgEl("line",{x1:L,x2:W-R,y1:Y(v),y2:Y(v),class:v===0?"zero":"grid"},svg); var tx=svgEl("text",{x:L-6,y:Y(v)+3,"text-anchor":"end",class:"ax"},svg); tx.textContent=shortMoney(v); }
  MON3.forEach(function(m,i){ var t=svgEl("text",{x:X(i),y:H-6,"text-anchor":"middle",class:"ax"},svg); t.textContent=m; });
  var band=svgEl("rect",{y:Tp,width:bw,height:H-Tp-B,fill:"var(--sunken)",visibility:"hidden"},svg);
  var barW=Math.max(3,bw*.24), z=Y(0), gap=2;
  /* a bar from v0 to v1, rounded only at the end away from the baseline */
  function bar(x0,v0,v1,fill,op,roundEnd){
    var ya=Y(v0), yb=Y(v1), up=yb<ya, h=Math.abs(ya-yb); if(h<0.5) return;
    var r=roundEnd?Math.min(3,h,barW/2):0, yt=Math.min(ya,yb), ybt=Math.max(ya,yb), d;
    if(!r) d="M"+x0+" "+yt+" H"+(x0+barW)+" V"+ybt+" H"+x0+" Z";
    else if(up) d="M"+x0+" "+ybt+" V"+(yt+r)+" Q"+x0+" "+yt+" "+(x0+r)+" "+yt+" H"+(x0+barW-r)+" Q"+(x0+barW)+" "+yt+" "+(x0+barW)+" "+(yt+r)+" V"+ybt+" Z";
    else d="M"+x0+" "+yt+" V"+(ybt-r)+" Q"+x0+" "+ybt+" "+(x0+r)+" "+ybt+" H"+(x0+barW-r)+" Q"+(x0+barW)+" "+ybt+" "+(x0+barW)+" "+(ybt-r)+" V"+yt+" Z";
    svgEl("path",{d:d,fill:fill,opacity:op},svg);
  }
  ys.forEach(function(x,i){
    var op=x.fut?.3:1, x0=X(i)-(3*barW+2*gap)/2;
    if(x.income>0) bar(x0,0,x.income,C_INC,op,true);

    if(x.mortgage>0){ var g=x.opex>0?(top-bot)*gap/(H-Tp-B):0; bar(x1,x.opex+g,x.opex+x.mortgage,C_MTG,op,true); }

  hit.addEventListener("mousemove",function(e){ var r=svg.getBoundingClientRect(), i=Math.max(0,Math.min(11,Math.floor(((e.clientX-r.left)/r.width*W-L)/bw))), x=ys[i];
    band.setAttribute("x",L+bw*i); band.setAttribute("visibility","visible");
    showTip(e,MONTHS[i]+" "+view.year+(x.fut?" · projected":""),[{k:"Rental income",v:money(x.income),c:C_INC},{k:"Operating costs",v:money(x.opex),c:C_OPX},{k:"Mortgage",v:money(x.mortgage),c:C_MTG},{k:"Net cash flow",v:money(x.net),c:C_NET}]); });
  hit.addEventListener("mouseleave",function(){ band.setAttribute("visibility","hidden"); hideTip(); });
  box.appendChild(svg); c.appendChild(box);

/* running total as a waterfall: each month steps up (green) or down (red)
   from where the last one left off; the end bar is the position to date */
function cumulativeCard(ys){
  var c=pcard("c5","Cumulative cash position","How each month built the running total through "+view.year);
  var pts=[], cum=0; ys.forEach(function(x){ if(x.fut) return; var s0=cum; cum+=x.net; pts.push({m:x.m,s:s0,e:cum,net:x.net}); });
  if(!pts.length){ c.appendChild(el("div","sub","Nothing has happened yet in "+view.year+".")); return c; }
  var leg=el("div","pleg");
  [[C_NET,"Month added cash"],["var(--down)","Month lost cash"],["var(--accent)","Position to date"]].forEach(function(l){ var s=el("span"), i=el("i"); i.style.background=l[0]; s.appendChild(i); s.appendChild(document.createTextNode(l[1])); leg.appendChild(s); });
  c.appendChild(leg);
  var W=460,H=220,L=50,R=8,Tp=16,B=24, n=pts.length+1;
  var all=[0]; pts.forEach(function(p){ all.push(p.s,p.e); });
  var mx=Math.max.apply(null,all), mn=Math.min.apply(null,all);
  var step=niceStep((mx-mn)/4||1), top=Math.ceil(mx/step)*step||step, bot=Math.floor(mn/step)*step;
  function Y(v){ return Tp+(H-Tp-B)*(top-v)/(top-bot); }
  var bw=(W-L-R)/n, barW=Math.max(4,bw*.62); function X(i){ return L+bw*(i+.5); }
  var box=el("div","pch"), svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"Waterfall of net cash flow by month in "+view.year+", ending at "+money(cum)});
  for(var v=bot;v<=top+1e-9;v+=step){ svgEl("line",{x1:L,x2:W-R,y1:Y(v),y2:Y(v),class:v===0?"zero":"grid"},svg); var tx=svgEl("text",{x:L-6,y:Y(v)+3,"text-anchor":"end",class:"ax"},svg); tx.textContent=shortMoney(v); }
  function rect(i,v0,v1,fill,title,list){
    var y=Math.min(Y(v0),Y(v1)), h=Math.max(1.5,Math.abs(Y(v0)-Y(v1)));
    var r=svgEl("rect",{x:X(i)-barW/2,y:y,width:barW,height:h,rx:2,fill:fill},svg);

    hit.addEventListener("mousemove",function(e){ showTip(e,title,list); }); hit.addEventListener("mouseleave",hideTip);
    return r;
  }
  pts.forEach(function(p,i){

    /* connector from this step's end to the next bar */
    if(i<pts.length) svgEl("line",{x1:X(i)+barW/2,x2:X(i+1)-barW/2,y1:Y(p.e),y2:Y(p.e),stroke:"var(--line-2)","stroke-width":1,"stroke-dasharray":"2 2"},svg);
    var t=svgEl("text",{x:X(i),y:H-6,"text-anchor":"middle",class:"ax"},svg); t.textContent=MON3[p.m].charAt(0)+(pts.length<=7?MON3[p.m].slice(1):"");
  });

  rect(ti,0,cum,"var(--accent)",(pts.length===12?"Full year ":"To date · ")+view.year,[{k:"Cash position",v:money(cum),c:"var(--accent)"}]);
  var tl=svgEl("text",{x:X(ti),y:H-6,"text-anchor":"middle",class:"ax"},svg); tl.textContent=pts.length===12?"Year":"YTD"; tl.style.fontWeight="600";

  lv.style.fill="var(--ink)"; lv.style.fontWeight="600"; lv.textContent=money(cum);
  box.appendChild(svg); c.appendChild(box);
  return c;

  var stepC=niceStep((up-dn)/4||1), topC=Math.ceil(up/stepC)*stepC||stepC, botC=Math.floor(dn/stepC)*stepC;
  function YC(v){ return Tp+(H-Tp-B)*(topC-v)/(topC-botC); }
  var bwC=(W-L-R)/12, colW=bwC*.56; function XC(i){ return L+bwC*(i+.5); }

    var ml=svgEl("text",{x:XC(x.m),y:H-6,"text-anchor":"middle",class:"ax"},svgC); ml.textContent=MON3[x.m];
    if(x.m===view.month){ ml.style.fill="var(--ink)"; ml.style.fontWeight="700"; }
    var hit=svgEl("rect",{x:L+bwC*x.m,y:0,width:bwC,height:H,fill:"transparent",style:"cursor:pointer"},svgC);
    hit.addEventListener("mousemove",function(e){ showTip(e,MONTHS[x.m]+" "+view.year+(x.fut?" · projected":""),
      x.parts.map(function(q){ return {k:q.p.name,v:money(q.v),c:PSLOT[q.i%PSLOT.length]}; }).concat([{k:"Total",v:money(x.tot)}])); });
    hit.addEventListener("mouseleave",hideTip);

  boxC.appendChild(svgC); f2.appendChild(boxC);
  var k3=el("div","key"); k3.style.marginTop="9px"; k3.style.whiteSpace="normal";

  f2.appendChild(k3);

  /* ── where the money went: one horizontal bar per property, stacked by

function propCard(p,key){
  var f=figuresFor(p,key);
  var card=el("div","prop");
  if(f.cashflow<0) card.dataset.sign="down";

  var head=el("div","phead");
  head.appendChild(el("div","pname",p.name||"Untitled"));
  if(f.void) head.appendChild(el("span","pflag","void"));
  else if(isOverridden(p,key)) head.appendChild(el("span","pflag","part month"));
  var c=el("div","pcash",money2(f.cashflow));
  if(f.cashflow<0) c.dataset.sign="down";
  head.appendChild(c);
  card.appendChild(head);

  var grid=el("div","pgrid");
  function cell(k,v,small){
    var d=el("div","pcell");
    d.appendChild(el("div","k",k));
    var val=el("div","v"); val.appendChild(document.createTextNode(v));
    if(small) val.appendChild(el("small",null," "+small));
    d.appendChild(val); grid.appendChild(d);
  }
  cell("Rent in",money2(f.income));
  cell("Mortgage",money2(f.mortgage));
  cell("Management",money2(f.mgmt),num(p.mgmtPct)?"("+num(p.mgmtPct)+"%)":"");
  cell("Insurance",money2(f.insurance));
  cell("One-off",money2(f.oneOff));
  cell("Return on cash",f.coc==null?"—":pct1(f.coc));
  cell("Gross yield",f.yield==null?"—":pct1(f.yield));
  card.appendChild(grid);

  var acts=el("div","pacts");
  var rb=el("label","rentbox");
  rb.appendChild(el("span","navsellab","Rent this month"));
  var ri=document.createElement("input");
  ri.type="number"; ri.step="0.01"; ri.min="0"; ri.value=String(f.income);
  ri.setAttribute("aria-label","Rent received for "+p.name+" in "+viewLabel());
  ri.onchange=function(){
    var v=num(this.value);
    var c2=clone(p); c2.rents=c2.rents||{};
    if(v===num(p.rent)) delete c2.rents[key]; else c2.rents[key]=v;
    save(c2);
  };
  rb.appendChild(ri);
  acts.appendChild(rb);
  if(isOverridden(p,key)){
    var rst=el("button","btn btn-ghost btn-sm","Reset to "+money(num(p.rent)));
    rst.onclick=function(){ var c2=clone(p); c2.rents=c2.rents||{}; delete c2.rents[key]; save(c2); };
    acts.appendChild(rst);
  }
  if(p.note) acts.appendChild(el("span","navsellab",p.note));
  acts.appendChild(el("span","grow"));
  var ed=el("button","btn btn-ghost btn-sm","Edit");
  ed.onclick=function(){ openEdit(p); };
  acts.appendChild(ed);
  card.appendChild(acts);

  /* log a one-off cost */
  var q=el("div","quick");
  var amt=document.createElement("input");
  amt.type="number"; amt.min="0"; amt.step="0.01"; amt.placeholder="Cost";
  amt.setAttribute("aria-label","Amount for "+p.name);
  var cat=document.createElement("select");
  cat.setAttribute("aria-label","Category");
  CATEGORIES.forEach(function(x){
    var o=document.createElement("option"); o.value=x; o.textContent=x; cat.appendChild(o);
  });
  var note=document.createElement("input");
  note.type="text"; note.placeholder="What it was";
  note.setAttribute("aria-label","Note");
  var d=quickDraft[p.id]||{};
  amt.value=d.amount||""; note.value=d.note||""; cat.value=d.category||CATEGORIES[0];
  function keep(){ quickDraft[p.id]={amount:amt.value,note:note.value,category:cat.value}; }
  amt.oninput=keep; note.oninput=keep; cat.onchange=keep;
  function add(){
    var a=num(amt.value);
    if(a<=0){ amt.focus(); return; }
    var n=new Date();
    var day=(n.getFullYear()===view.year&&n.getMonth()===view.month)?ymd(n):key+"-01";
    delete quickDraft[p.id];
    save({id:uid(),kind:"expense",propId:p.id,month:key,date:day,amount:a,
          category:cat.value,note:note.value.trim(),createdAt:nowIso(),schema:SCHEMA});
  }
  amt.onkeydown=note.onkeydown=function(e){ if(e.key==="Enter") add(); };
  var go=el("button","btn btn-sm","Add cost");
  go.onclick=add;
  q.appendChild(amt); q.appendChild(cat); q.appendChild(note); q.appendChild(go);
  card.appendChild(q);

  var es=expensesOf(p.id,key);
  if(es.length){
    var wrap=el("div","entries");
    es.forEach(function(e){
      var r=el("div","entry");
      r.appendChild(el("span","ecat",e.category||"Other"));
      r.appendChild(el("span","enote",e.note||"—"));

      x.onclick=function(){ remove(e.id); };
      r.appendChild(x);
      wrap.appendChild(r);
    });
    card.appendChild(wrap);
  }
  return card;
}
